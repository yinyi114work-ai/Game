<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f8caa6"><title>個管手速王 V1.0｜多工大作戰</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#e9b18a;color:#fff}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#app{position:relative;height:100dvh;max-width:520px;margin:auto;overflow:hidden;background:linear-gradient(160deg,#ffdfb5,#e6a878);isolation:isolate}.hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;height:74px;z-index:12;display:flex;gap:6px;padding:7px 8px;background:linear-gradient(#4a2b25ef,#4a2b25b0 80%,transparent)}.stat{flex:1;min-width:0;background:#58382bdc;border:1.5px solid #fff9;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 9px #0003}.stat small{font-size:10px;font-weight:900}.stat b{font-size:clamp(19px,5.5vw,28px);line-height:1.15;font-variant-numeric:tabular-nums}.stat .meter{width:80%;height:8px;border-radius:10px;background:#ffffff55;overflow:hidden;margin-top:4px}.stat .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#80e68b,#ffcd47,#f14236);transition:width .2s}.stage{position:absolute;top:calc(env(safe-area-inset-top) + 74px);bottom:calc(env(safe-area-inset-bottom) + 51px);width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#d9ad86}.scene{position:relative;width:100%;height:100%;overflow:hidden;touch-action:manipulation}.scene img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}.spot{position:absolute;border:0;background:transparent;border-radius:19%;padding:0;z-index:3;--light:#ffd15d;outline:0}.spot.active:before{content:"";position:absolute;inset:0;border-radius:20%;background:color-mix(in srgb,var(--light) 10%,transparent);box-shadow:inset 0 0 14px var(--light),0 0 0 2px #fff9,0 0 15px 5px var(--light);animation:pulse 1s ease-in-out infinite alternate}.spot.active .count{display:grid}.spot .count{display:none;position:absolute;right:-9px;top:-10px;min-width:26px;height:26px;border-radius:99px;background:#e63c36;border:2px solid #fff;place-items:center;padding:0 4px;font-size:13px;font-weight:1000;color:white;box-shadow:0 2px 6px #0006}.spot.busy:before{box-shadow:0 0 14px 6px #83ebff;animation:pulse .5s ease-in-out infinite alternate}.spot:active{transform:scale(.97)}.spot.shake{animation:shake .35s ease-in-out}.spot.done:after{content:'✓';position:absolute;left:40%;top:35%;font-size:35px;font-weight:1000;color:#fff;text-shadow:0 0 8px #29b66a,0 0 14px #29b66a;animation:pop .6s both;pointer-events:none}.step{position:absolute;z-index:4;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);background:#fff8e9;color:#743e2c;border:2px solid #fff;border-radius:13px;box-shadow:0 3px 12px #4c291e77;font-size:clamp(10px,2.7vw,13px);font-weight:1000;white-space:nowrap;padding:6px 9px;pointer-events:none;opacity:0;transition:opacity .12s}.spot.active .step{opacity:1}.spot[data-key=plan] .step,.spot[data-key=phone] .step{bottom:auto;top:calc(100% + 3px)}.spot[data-key=visit] .step{right:0;left:auto;transform:none}.mini-progress{position:absolute;bottom:-8px;left:9%;width:82%;height:6px;border-radius:8px;background:#40251f99;border:1px solid #fff9;overflow:hidden;opacity:0}.spot.active .mini-progress{opacity:1}.mini-progress i{display:block;background:#7cf1a7;height:100%;width:0;transition:width .16s}.spark{position:absolute;z-index:15;pointer-events:none;font-weight:1000;font-size:22px;text-shadow:0 2px 5px #54301b;color:#fff;animation:fly .85s ease-out forwards}.hint{position:absolute;z-index:10;top:10px;left:50%;transform:translateX(-50%);background:#fff8e9ed;border:2px solid #fff;border-radius:16px;color:#78452f;padding:9px 14px;box-shadow:0 5px 15px #4c281c44;font-size:13px;font-weight:900;text-align:center;max-width:91%;opacity:0;pointer-events:none;transition:opacity .2s}.hint.show{opacity:1}.speech{position:absolute;z-index:5;left:31%;top:17%;max-width:47%;background:#fff9e6e8;color:#80452e;border:2px solid white;border-radius:20px 20px 20px 3px;padding:7px 9px;font-size:12px;font-weight:900;box-shadow:0 3px 12px #0003;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}.speech.show{opacity:1;transform:translateY(0)}.footer{position:absolute;bottom:0;left:0;right:0;height:calc(51px + env(safe-area-inset-bottom));z-index:10;background:linear-gradient(90deg,#684332,#4e312a);border-top:2px solid #ffe7c7;display:flex;align-items:flex-start;justify-content:space-between;padding:9px 12px;color:#fff7e9;font-size:12px;font-weight:850;gap:10px}.footer span:last-child{white-space:nowrap}.danger{position:absolute;inset:0;z-index:11;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 6px #f9413b,inset 0 0 60px 30px #ed1e2499;transition:opacity .2s}.danger.warn{opacity:.16;animation:alarm 1.8s ease-in-out infinite}.danger.high{opacity:.4;animation:alarm 1.1s ease-in-out infinite}.danger.critical{opacity:.7;animation:alarm .72s ease-in-out infinite}.overlay{position:absolute;inset:0;z-index:30;background:#321b17cf;display:grid;place-items:center;padding:20px}.overlay.hidden{display:none}.modal{width:100%;max-width:390px;border:3px solid #fff;background:linear-gradient(150deg,#fff9e9,#f8d3a9);color:#78432c;border-radius:28px;padding:23px 20px;text-align:center;box-shadow:0 12px 35px #0008}.modal h1{margin:0 0 8px;font-size:29px}.modal p{font-size:14px;line-height:1.65}.modal button,.visit-button{border:0;border-radius:15px;background:linear-gradient(#ffad62,#d87537);color:white;font-size:18px;font-weight:1000;padding:14px 20px;width:100%;box-shadow:0 4px 0 #a74e2b}.modal button:active,.visit-button:active{transform:translateY(3px);box-shadow:0 1px 0 #a74e2b}.modal small{font-size:12px;color:#98755f}.big-score{font-size:36px;font-weight:1000;color:#b35a31}.visit{position:absolute;inset:0;z-index:22;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(170deg,#fff3d9,#eeb781);color:#7d452f;text-align:center;padding:22px}.visit.show{display:flex}.visit .scooter{font-size:80px;animation:ride .6s ease-in-out infinite alternate}.visit h2{margin:0;font-size:26px}.visit p{margin:0;font-weight:700}.visit .visit-button{max-width:320px;min-height:66px}.visit .visit-button:disabled{opacity:.6}.visit .visit-timer{height:12px;width:min(300px,90%);border-radius:10px;background:#d9a381;overflow:hidden}.visit .visit-timer i{display:block;width:0;height:100%;background:#5aaf7e}.callstate{position:absolute;top:calc(env(safe-area-inset-top) + 79px);right:7px;z-index:14;background:#3c9d65;color:#fff;border:2px solid white;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:900;display:none}.callstate.show{display:block}.characterfx{position:absolute;top:21%;left:50%;font-size:30px;z-index:4;opacity:0;pointer-events:none;animation:float 1s infinite alternate}.characterfx.show{opacity:1}@keyframes pulse{to{filter:brightness(1.3);transform:scale(1.025)}}@keyframes fly{to{opacity:0;transform:translateY(-65px) scale(1.2)}}@keyframes pop{0%{opacity:0;transform:scale(.2)}45%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}@keyframes alarm{50%{opacity:.03}}@keyframes ride{to{transform:translateX(24px) rotate(3deg)}}@keyframes float{to{transform:translateY(-10px) rotate(8deg)}}@media(prefers-reduced-motion:reduce){.danger.warn,.danger.high,.danger.critical,.spot.active:before,.characterfx.show{animation:none}}@media(max-height:670px){.hud{height:60px}.stage{top:calc(env(safe-area-inset-top) + 60px)}.stat b{font-size:19px}.footer{height:calc(42px + env(safe-area-inset-bottom));font-size:11px}.stage{bottom:calc(env(safe-area-inset-bottom) + 42px)}}
.miss-stat b{color:#ffbd9c}.miss-stat{flex:.7}.spot{border-radius:12px}.spot.active:before{border-radius:12px;box-shadow:inset 0 0 11px var(--light),0 0 0 2px #fffa,0 0 13px 3px var(--light)}.spark.missfx{color:#ff4343;font-size:27px;text-shadow:0 1px 0 white,0 0 10px white}@media(max-width:390px){.hud{gap:4px;padding:7px 4px}.stat small{font-size:9px}.stat b{font-size:19px}} </style></head><body><div id="app"><div class="hud"><div class="stat"><small>⏱️ 剩餘時間</small><b id="timer">01:00</b></div><div class="stat"><small>⭐ 分數</small><b id="score">0</b></div><div class="stat miss-stat"><small>✖ MISS</small><b id="missCount">0</b></div><div class="stat"><small>❤️ 壓力值</small><b id="stressText">0%</b><div class="meter"><i id="stressBar"></i></div></div></div><div class="stage"><div class="scene" id="scene"><img src="office.jpg" alt="個案管理員辦公室"><button class="spot" data-key="plan" style="left:5.6%;top:44.2%;width:21.1%;height:18.0%;--light:#65baff" aria-label="照顧計畫"><span class="count"></span><span class="step"></span><span class="mini-progress"><i></i></span></button><button class="spot" data-key="phone" style="left:72.0%;top:40.3%;width:22.0%;height:13.8%;--light:#ffcf49" aria-label="室內電話"><span class="count"></span><span class="step"></span><span class="mini-progress"><i></i></span></button><button class="spot" data-key="line" style="left:67.4%;top:55.2%;width:14.0%;height:20.4%;--light:#52f29d" aria-label="LINE"><span class="count"></span><span class="step"></span><span class="mini-progress"><i></i></span></button><button class="spot" data-key="visit" style="left:80.3%;top:69.4%;width:18.8%;height:22.0%;--light:#ffc25b" aria-label="家訪"><span class="count"></span><span class="step"></span><span class="mini-progress"><i></i></span></button><button class="spot" data-key="incident" style="left:42.0%;top:68.7%;width:24.5%;height:22.0%;--light:#ff5753" aria-label="異常事件"><span class="count"></span><span class="step"></span><span class="mini-progress"><i></i></span></button><button class="spot" data-key="budget" style="left:17.4%;top:73.0%;width:21.0%;height:20.1%;--light:#ffe05c" aria-label="開額度"><span class="count"></span><span class="step"></span><span class="mini-progress"><i></i></span></button><div class="hint" id="hint"></div><div class="speech" id="speech"></div><div class="characterfx" id="characterfx">💦</div></div></div><div class="callstate" id="callstate">☎ 通話中・仍可多工</div><div class="footer"><span id="status">點擊發光物件，直接完成工作</span><span id="summary">完成 0｜MISS 0｜未完成 0</span></div><div class="danger" id="danger"></div><div class="visit" id="visit"><div class="scooter">🛵</div><h2 id="visitTitle">家訪任務</h2><p id="visitDesc">出發後將暫時無法操作辦公室工作</p><button class="visit-button" id="visitStart">出發家訪</button><button class="visit-button" id="visitCancel" style="background:#a8866e;box-shadow:none">返回辦公室</button><div class="visit-timer" id="visitMeter" style="display:none"><i id="visitFill"></i></div></div><div class="overlay" id="overlay"><div class="modal" id="modal"><h1>個管手速王</h1><p>60 秒多工大作戰！<br>哪個物件發光，就直接點它完成工作。<br>家訪會暫時離開辦公室；壓力到 100% 就 Burnout！</p><button id="start">開始上班！</button><p><small>V1.0｜場景直點・多工・壓力警報</small></p></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),types=['plan','phone','line','visit','incident','budget'];const names={plan:'照顧計畫',phone:'室內電話',line:'LINE',visit:'家訪',incident:'異常事件',budget:'開額度'};const steps={plan:['確認個案需求','安排服務項目','送出照顧計畫'],phone:['接聽電話','結束通話'],line:['回覆 LINE'],visit:['出發家訪'],incident:['聯繫確認','協調處理','完成通報'],budget:['確認額度','開立完成','完成任務']};const award={plan:150,phone:60,line:40,visit:240,incident:300,budget:200},fine={plan:80,phone:70,line:35,visit:120,incident:170,budget:75},limit={plan:13,phone:7,line:11,visit:17,incident:16,budget:18};const spots=Object.fromEntries([...document.querySelectorAll('.spot')].map(e=>[e.dataset.key,e]));let unfinished=0,phoneHoles=0, q={},playing=false,elapsed=0,score=0,done=0,miss=0,stress=0,started=0,lastSpawn=0,raf=0,call=null,travel=null,lastSecond=-1,hintTimeout=0,speechTimeout=0;function tip(s){$('hint').textContent=s;$('hint').classList.add('show');clearTimeout(hintTimeout);hintTimeout=setTimeout(()=>$('hint').classList.remove('show'),950)}function say(s){$('speech').textContent=s;$('speech').classList.add('show');clearTimeout(speechTimeout);speechTimeout=setTimeout(()=>$('speech').classList.remove('show'),1700)}function effect(k,s){let e=document.createElement('div'),p=spots[k];e.className='spark'+(s.includes('MISS')?' missfx':'');e.textContent=s;e.style.left=(p.offsetLeft+p.offsetWidth*.35)+'px';e.style.top=(p.offsetTop+p.offsetHeight*.2)+'px';$('scene').appendChild(e);setTimeout(()=>e.remove(),850)}function spawn(k){if(!playing||q[k].length>=(k==='line'?5:3))return;q[k].push({step:0,due:elapsed+limit[k],special:k==='phone'&&(phoneHoles===0||Math.random()<.42),ready:0,extensions:0,answered:false});spots[k].classList.remove('shake');void spots[k].offsetWidth;spots[k].classList.add('shake');if(k==='incident')say('異常事件！先確認安全！');if(k==='phone')effect(k,'☎');render()}function complete(k){if(!q[k].length)return;const completed=q[k].shift();if(k==='phone'&&completed.special)phoneHoles++;score+=award[k];done++;spots[k].classList.add('done');setTimeout(()=>spots[k].classList.remove('done'),650);effect(k,'+'+award[k]);if(k==='phone')call=null;render()}function clickSpot(k){if(!playing||travel)return;const j=q[k][0];if(!j){tip(names[k]+'目前沒有待辦');return}if(k==='visit'){$('visit').classList.add('show');$('visitTitle').textContent='家訪任務';$('visitDesc').textContent='準備出發？外出期間其他工作仍會累積';$('visitStart').style.display='block';$('visitCancel').style.display='block';$('visitMeter').style.display='none';return}if(k==='phone'){if(j.step===0){j.step=1;j.answered=true;j.due=Infinity;j.ready=elapsed+(j.special?2.4:0.65);call=j;tip(j.special?'☎ 電話黑洞！對方話好多…':'☎ 已接聽，可繼續多工');say(j.special?'您好…我想再問一下…':'您好，我是個管！');effect(k,j.special?'☎ 長話中':'☎ 接通')}else if(elapsed>=j.ready){if(j.special&&j.extensions<2){j.extensions++;j.ready=elapsed+(j.extensions===1?2.5:2);say(j.extensions===1?'啊！對了！還有一件事…':'等一下！我突然想到…');effect(k,'又來了！');tip('電話黑洞：還沒講完！可先處理其他工作')}else{complete(k);say(j.special?'終於掛電話了！':'通話結束！')}}else{tip(j.special?'對方還在講…先處理其他工作吧':'通話中…可先處理其他工作')}render();return}j.step++;effect(k,'✓');if(j.step>=steps[k].length){complete(k);if(k==='incident')say('異常事件處理完成！')}else{tip(names[k]+'：'+steps[k][j.step]);render()}}function pressure(){let n=types.reduce((v,k)=>v+q[k].length,0);let overdueSoon=types.reduce((v,k)=>v+q[k].filter(j=>j.due-elapsed<3).length,0);return Math.min(100,Math.round(n*7+overdueSoon*4+miss*5+(elapsed>45?7:0)))}function render(){if(!playing)return;stress=pressure();for(let k of types){let p=spots[k],count=q[k].length,j=q[k][0];p.classList.toggle('active',count>0);p.classList.toggle('busy',k==='phone'&&!!call);p.querySelector('.count').textContent=count;p.querySelector('.step').textContent=j?(k==='phone'&&j.step===1?(elapsed>=j.ready?(j.special&&j.extensions<2?'對方又想起一件事…':'點擊掛電話'):(j.special?'電話黑洞・長話中':'通話中…')):steps[k][Math.min(j.step,steps[k].length-1)]):'';if(j&&(k==='plan'||(k==='phone'&&!j.answered))){p.querySelector('.step').textContent+=' ⏳'+Math.max(0,Math.ceil(j.due-elapsed))+'s'}p.querySelector('.mini-progress i').style.width=j?(j.step/steps[k].length*100)+'%':'0%'}$('score').textContent=score;$('missCount').textContent=miss;$('timer').textContent=elapsed<1?'01:00':'00:'+String(Math.max(0,Math.ceil(60-elapsed))).padStart(2,'0');$('stressText').textContent=stress+'%';$('stressBar').style.width=stress+'%';$('summary').textContent='完成 '+done+'｜MISS '+miss+'｜待辦 '+types.reduce((a,k)=>a+q[k].length,0);$('status').textContent=stress>=80?'⚠️ 工作爆量！優先處理急件':call?'☎ 通話中，仍可處理其他工作':'點擊發光物件，直接完成工作';$('callstate').classList.toggle('show',!!call);$('characterfx').classList.toggle('show',stress>=60);$('danger').className='danger'+(stress>=90?' critical':stress>=80?' high':stress>=60?' warn':'');if(stress>=100)finish(true)}function pick(){let phase=elapsed<15?0:elapsed<30?1:elapsed<45?2:3,pool=phase===0?['plan','line','phone','budget']:phase===1?['plan','line','line','phone','visit','budget','incident']:['plan','line','line','phone','phone','visit','budget','incident','incident'];spawn(pool[Math.floor(Math.random()*pool.length)]);if(phase===3&&Math.random()<.35)spawn('line');lastSpawn=elapsed}function tick(t){if(!playing)return;elapsed=Math.min(60,(t-started)/1000);if(elapsed-lastSpawn>(elapsed<15?4.2:elapsed<30?3.25:elapsed<45?1.65:.83))pick();for(let k of types){while(q[k].length&&q[k][0].due<=elapsed){const old=q[k].shift();if(k==='phone'&&old===call)call=null;miss++;score=Math.max(0,score-fine[k]);effect(k,'MISS!');if(k==='incident')say('異常事件逾時！')}}if(travel){let f=Math.min(1,(elapsed-travel.at)/travel.duration);$('visitFill').style.width=f*100+'%';if(f>=1){$('visit').classList.remove('show');travel=null;if(q.visit.length&&q.visit[0].step===1)complete('visit');say('家訪回來了，訊息好多！')}}if(Math.floor(elapsed)!==lastSecond){lastSecond=Math.floor(elapsed);if(stress>=80&&Math.random()<.35)say('怎麼又來了！')}if(elapsed>=60){finish(false);return}render();if(playing)raf=requestAnimationFrame(tick)}function start(){q=Object.fromEntries(types.map(k=>[k,[]]));playing=true;elapsed=0;score=0;done=0;miss=0;stress=0;call=null;travel=null;lastSpawn=0;lastSecond=-1;unfinished=0;phoneHoles=0;$('overlay').classList.add('hidden');$('visit').classList.remove('show');started=performance.now();spawn('plan');spawn('line');render();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function finish(burn){if(!playing)return;playing=false;cancelAnimationFrame(raf);$('visit').classList.remove('show');$('callstate').classList.remove('show');unfinished=types.reduce((a,k)=>a+q[k].length,0);let rank=score>=1600?'多工傳說':score>=1000?'個管手速王':score>=550?'資深個管':'努力中的個管';$('modal').innerHTML='<h1>'+(burn?'🔥 Burnout！':'下班啦！')+'</h1><p>'+(burn?'壓力值達到 100%，提前結束挑戰。':'60 秒挑戰完成！')+'</p><h2>'+rank+'</h2><div class="big-score">'+score+' 分</div><p>完成 '+done+' 件｜MISS '+miss+' 件｜未完成 '+unfinished+' 件</p><p>電話黑洞 '+phoneHoles+' 次｜壓力 '+stress+'%</p><button id="again">再挑戰一次</button>';$('overlay').classList.remove('hidden');$('again').onclick=start}types.forEach(k=>spots[k].onclick=()=>clickSpot(k));$('start').onclick=start;$('visitStart').onclick=()=>{if(!playing||!q.visit.length)return;const j=q.visit[0];j.step=1;travel={at:elapsed,duration:3};$('visitTitle').textContent='正在家訪中…';$('visitDesc').textContent='其他工作仍會累積，回辦公室再處理';$('visitStart').style.display='none';$('visitCancel').style.display='none';$('visitMeter').style.display='block'};$('visitCancel').onclick=()=>$('visit').classList.remove('show');})();
</script></body></html>
