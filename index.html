<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f8d4b0"><title>個管手速王 V0.7｜辦公室大混亂</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',system-ui,sans-serif;background:#ffe9d0;color:#603825}button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:linear-gradient(160deg,#fff2df,#f3bd90);overflow:hidden;position:relative}.hud{height:76px;flex:none;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;padding:calc(6px + env(safe-area-inset-top)*.4) 9px 5px;z-index:5}.stat{border:2px solid #fff9;background:linear-gradient(160deg,#775045,#4b302a);color:#fff;border-radius:16px;text-align:center;box-shadow:0 4px 8px #76422b38;display:flex;flex-direction:column;justify-content:center}.stat small{font-size:11px;font-weight:800}.stat b{font-size:clamp(21px,6vw,30px);line-height:1.13;font-variant-numeric:tabular-nums}.stat .bar{height:9px;border-radius:20px;background:#ffe9d6;margin:6px 10px 0;overflow:hidden}.stat .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fd36c,#f5d144,#ee5a49);transition:width .2s}.scene-area{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center;background:radial-gradient(#ffdfbb,#e8b78f)}.scene{position:relative;max-height:100%;max-width:100%;aspect-ratio:1024/1080;height:100%;width:auto;overflow:hidden;box-shadow:0 0 20px #8e513244}.scene img{width:100%;height:100%;display:block;pointer-events:none}.spot{position:absolute;border:0;border-radius:18%;background:transparent;padding:0;z-index:2}.spot.ready:before{content:'';position:absolute;inset:0;border-radius:19%;box-shadow:inset 0 0 18px var(--light),0 0 0 3px #fff8,0 0 20px 6px var(--light);background:color-mix(in srgb,var(--light) 13%,transparent);animation:glow .8s ease-in-out infinite alternate;pointer-events:none}.spot.ready:after{content:attr(data-count);position:absolute;top:-12px;right:-9px;min-width:27px;height:27px;padding:2px 5px;display:grid;place-items:center;border-radius:99px;background:#e94d3d;border:2px solid white;color:#fff;font-size:14px;font-weight:1000;box-shadow:0 2px 5px #0005}.spot.selected{outline:3px dashed white;outline-offset:1px}.spot:active{transform:scale(.96)}@keyframes glow{to{filter:brightness(1.4);transform:scale(1.025)}}.label{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:#4d2f29dd;border:1px solid #fff9;border-radius:99px;color:white;padding:2px 7px;white-space:nowrap;font-size:11px;font-weight:900;opacity:0;pointer-events:none}.spot.ready .label{opacity:1}.spark{position:absolute;z-index:9;pointer-events:none;font-size:23px;font-weight:1000;color:#fff;text-shadow:0 2px 6px #76431c;animation:fly .75s ease-out forwards}@keyframes fly{to{transform:translateY(-70px) scale(1.2);opacity:0}}.bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:92%;background:#fff9e9ee;color:#75412b;border:2px solid white;box-shadow:0 4px 12px #6e41294d;border-radius:15px;padding:7px 12px;font-size:13px;font-weight:900;text-align:center;z-index:4;opacity:0;transition:opacity .15s;pointer-events:none}.bubble.show{opacity:1}.desk{height:160px;flex:none;position:relative;z-index:6;background:linear-gradient(180deg,#fff7e9,#ffddbd);border-top:3px solid #fff;box-shadow:0 -6px 18px #79422c35;padding:8px 11px calc(9px + env(safe-area-inset-bottom)*.4);display:flex;flex-direction:column;gap:6px}.desk-top{display:flex;justify-content:space-between;align-items:center;gap:7px;font-size:12px;font-weight:900;color:#89533b}.desk-top span:last-child{font-size:11px;color:#a25d42}.work{flex:1;border:2px solid #f0c5a5;background:#fffaf3;border-radius:17px;padding:9px;display:flex;align-items:center;gap:9px;min-height:0}.work-info{flex:1;min-width:0}.work-title{font-size:16px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work-desc{font-size:12px;color:#9b6a53;line-height:1.35;margin-top:3px}.action{min-width:130px;max-width:52%;min-height:58px;border:0;border-radius:13px;color:#fff;font-size:15px;font-weight:1000;background:linear-gradient(#ffae5f,#db6e37);box-shadow:0 4px 0 #a84b2c;padding:6px 9px}.action:disabled{opacity:.55}.action:active{transform:translateY(2px);box-shadow:0 2px 0 #a84b2c}.progress{height:6px;border-radius:9px;background:#f1d8c5;margin-top:6px;overflow:hidden}.progress>i{display:block;background:#ef9551;height:100%;transition:width .2s}.work-empty{width:100%;text-align:center;font-weight:800;font-size:14px;color:#9d6b50}.tiny{font-size:11px}.callpill{position:absolute;z-index:5;top:45px;right:10px;background:#4f9d74;color:white;border:2px solid #fff;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:900;display:none;box-shadow:0 3px 8px #0003}.callpill.show{display:block}.travel{position:absolute;inset:0;background:#ffdfb8ec;z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#75432c;font-size:24px;font-weight:1000;text-align:center}.travel.show{display:flex}.scooter{font-size:76px;animation:ride .5s infinite alternate}@keyframes ride{to{transform:translateX(18px) rotate(5deg)}}.overlay{position:absolute;inset:0;z-index:30;background:#342019c9;display:grid;place-items:center;padding:22px}.modal{width:100%;max-width:390px;background:linear-gradient(160deg,#fffaf0,#ffe1c3);border:4px solid #fff;border-radius:27px;box-shadow:0 16px 50px #291208a0;padding:24px 18px;text-align:center}.modal h1{font-size:30px;margin:0 0 7px;color:#8c472b}.modal p{line-height:1.6;font-size:14px}.modal button{width:100%;border:0;border-radius:16px;padding:14px;background:linear-gradient(#f7a45b,#d8753b);box-shadow:0 4px 0 #a45230;color:white;font-size:19px;font-weight:1000}.modal .muted{font-size:12px;color:#9d765f}.scoreline{font-size:34px;font-weight:1000;color:#b55d32}@media(max-height:720px){.hud{height:64px}.desk{height:142px}.work{padding:6px}.action{min-height:48px}.work-title{font-size:14px}}
</style></head><body><div id="app"><header class="hud"><div class="stat"><small>⏱️ 剩餘時間</small><b id="timer">00:45</b></div><div class="stat"><small>⭐ 分數</small><b id="score">0</b></div><div class="stat"><small>❤️ 壓力指數</small><b id="stressText">0%</b><div class="bar"><span id="stress"></span></div></div></header><div class="scene-area"><div class="scene" id="scene"><img src="office.jpg" alt="個管辦公室"><button class="spot" data-key="plan" aria-label="照顧計畫" style="left:4%;top:43%;width:24%;height:18%;--light:#61b7ff"><span class="label">照顧計畫</span></button><button class="spot" data-key="phone" aria-label="室內電話" style="left:72%;top:37%;width:27%;height:19%;--light:#ffd046"><span class="label">室內電話</span></button><button class="spot" data-key="line" aria-label="LINE" style="left:66%;top:55%;width:18%;height:17%;--light:#6cf19c"><span class="label">LINE</span></button><button class="spot" data-key="visit" aria-label="家訪" style="left:80%;top:61%;width:19%;height:34%;--light:#ffcf59"><span class="label">家訪</span></button><button class="spot" data-key="incident" aria-label="異常事件" style="left:40%;top:71%;width:27%;height:24%;--light:#ff5b53"><span class="label">異常事件</span></button><button class="spot" data-key="budget" aria-label="開額度" style="left:14%;top:80%;width:26%;height:18%;--light:#ffdf5e"><span class="label">開額度</span></button><div class="bubble" id="bubble"></div><div class="callpill" id="callpill">☎ 通話中 · 可繼續工作</div><div class="travel" id="travel"><div class="scooter">🛵</div>正在家訪中…<small style="font-size:14px">辦公室工作仍在累積！</small></div></div></div><footer class="desk"><div class="desk-top"><span id="workLabel">📋 點擊發光物件處理工作</span><span id="summary">完成 0｜逾時 0</span></div><div class="work" id="work"><div class="work-empty">哪裡亮了，就點哪裡！<div class="tiny">可隨時切換工作，進度不會消失</div></div></div></footer><div class="overlay" id="overlay"><div class="modal" id="modal"><h1>個管手速王</h1><p>45 秒多工大作戰！<br>辦公室哪個物件亮起來，就直接點它。<br>可以隨時切換工作，電話中也能繼續忙！</p><button id="start">開始上班！</button><p class="muted">V0.7｜發光通知・多工切換・動畫回饋</p></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),types=['plan','phone','line','visit','incident','budget'],title={plan:'照顧計畫',phone:'室內電話',line:'LINE 訊息',visit:'家訪',incident:'異常事件',budget:'開額度'},points={plan:150,phone:60,line:40,visit:240,incident:300,budget:200},penalty={plan:90,phone:60,line:35,visit:140,incident:170,budget:80},limits={plan:15,phone:8,line:10,visit:17,incident:15,budget:18},steps={plan:['確認個案需求','安排照顧服務','送出照顧計畫'],incident:['聯繫確認安全','協調後續處理','完成通報紀錄'],budget:['確認本月額度','開立完成・儲存']};let queues={},chosen=null,running=false,elapsed=0,score=0,done=0,miss=0,visitUntil=0,callUntil=0,activeCall=null,startedAt=0,lastSpawn=0,raf=0,bubbleTimer=0,lastTick=0;const spots=Object.fromEntries([...document.querySelectorAll('.spot')].map(e=>[e.dataset.key,e]));function msg(s){const b=$('bubble');b.textContent=s;b.classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>b.classList.remove('show'),900)}function sparkle(k,s){let e=document.createElement('div');e.className='spark';e.textContent=s;let p=spots[k];e.style.left=(p.offsetLeft+p.offsetWidth*.4)+'px';e.style.top=(p.offsetTop+8)+'px';$('scene').appendChild(e);setTimeout(()=>e.remove(),780)}function add(k){if(!running)return;let q=queues[k];if(q.length>=(k==='line'?5:3))return;q.push({step:0,due:elapsed+limits[k],special:k==='phone'&&Math.random()<.32});sparkle(k,'!');if(k==='incident')msg('⚠️ 異常事件！請優先處理');update()}function finish(k){queues[k].shift();score+=points[k];done++;sparkle(k,'+'+points[k]);if(k==='phone'){activeCall=null;callUntil=0}if(chosen===k&&!queues[k].length)chosen=null;update()}function tap(k){if(!running||visitUntil>elapsed)return;if(!queues[k].length){msg(title[k]+'目前沒有待辦');return}chosen=k;if(k==='phone'&&!queues.phone[0].step){queues.phone[0].step=1;activeCall=queues.phone[0];callUntil=elapsed+(activeCall.special?5:2);msg(activeCall.special?'☎ 電話黑洞！一邊聽一邊工作':'☎ 接通了！可以繼續處理其他工作')}update()}function act(){if(!running||!chosen||visitUntil>elapsed)return;let k=chosen,j=queues[k][0];if(!j)return;if(k==='phone'){if(j.step&&elapsed>=callUntil)finish(k);return}if(k==='visit'){visitUntil=elapsed+2.8;j.step=1;chosen=null;$('travel').classList.add('show');msg('🛵 出發家訪！');update();return}if(k==='line'){finish(k);return}j.step++;sparkle(k,'✓');if(j.step>=steps[k].length)finish(k);else update()}function update(){let n=0;for(let k of types){let count=queues[k].length;n+=count;spots[k].classList.toggle('ready',count>0);spots[k].classList.toggle('selected',chosen===k);spots[k].dataset.count=count||''}let stress=Math.min(100,n*13+miss*4);$('stress').style.width=stress+'%';$('stressText').textContent=stress+'%';$('score').textContent=score;$('timer').textContent='00:'+String(Math.max(0,Math.ceil(45-elapsed))).padStart(2,'0');$('summary').textContent='完成 '+done+'｜逾時 '+miss;$('callpill').classList.toggle('show',!!activeCall&&elapsed<callUntil);render()}function render(){let w=$('work');if(!chosen||!queues[chosen].length){$('workLabel').textContent='📋 點擊發光物件處理工作';w.innerHTML='<div class="work-empty">哪裡亮了，就點哪裡！<div class="tiny">可隨時切換工作，進度不會消失</div></div>';return}let k=chosen,j=queues[k][0],s=steps[k],label='',desc='',progress=0,disabled=false;if(s){label=s[j.step];desc='步驟 '+(j.step+1)+' / '+s.length+' · 隨時可切換';progress=j.step/s.length*100}else if(k==='line'){label='回覆這則訊息';desc='未讀 '+queues.line.length+' 則';progress=0}else if(k==='visit'){label='出發家訪';desc='外出約 3 秒，其他工作會累積';progress=0}else if(k==='phone'){disabled=elapsed<callUntil;label=disabled?'通話中…':'結束通話';desc=disabled?'可以同時處理其他工作':'完成這通電話';progress=disabled?50:100}w.innerHTML='';let info=document.createElement('div');info.className='work-info';let t=document.createElement('div');t.className='work-title';t.textContent=title[k];let d=document.createElement('div');d.className='work-desc';d.textContent=desc;let bar=document.createElement('div');bar.className='progress';let fill=document.createElement('i');fill.style.width=progress+'%';bar.appendChild(fill);info.append(t,d,bar);let b=document.createElement('button');b.className='action';b.textContent=label;b.disabled=disabled;b.onclick=act;w.append(info,b)}function spawn(){let phase=elapsed<9?0:elapsed<22?1:elapsed<34?2:3,pool=phase===0?['plan','line','phone','budget']:phase===1?['plan','line','line','phone','visit','budget','incident']:['plan','line','line','phone','phone','visit','budget','incident','incident'];add(pool[Math.floor(Math.random()*pool.length)]);if(phase>=2&&Math.random()<.19)add('line');lastSpawn=elapsed}function tick(t){if(!running)return;elapsed=Math.min(45,(t-startedAt)/1000);if(elapsed-lastSpawn>(elapsed<9?2.4:elapsed<22?1.8:elapsed<34?1.35:1.03))spawn();for(let k of types){let q=queues[k];while(q.length&&q[0].due<=elapsed){let old=q.shift();if(k==='phone'&&old===activeCall){activeCall=null;callUntil=0}miss++;score=Math.max(0,score-penalty[k]);sparkle(k,'逾時');if(chosen===k)chosen=q.length?k:null}}if(visitUntil&&elapsed>=visitUntil){visitUntil=0;$('travel').classList.remove('show');if(queues.visit.length&&queues.visit[0].step===1)finish('visit')}if(activeCall&&elapsed>=callUntil&&lastTick<callUntil){msg('☎ 通話可結束，其他工作也能繼續')}lastTick=elapsed;if(elapsed>=45){end();return}update();raf=requestAnimationFrame(tick)}function start(){queues=Object.fromEntries(types.map(k=>[k,[]]));chosen=null;running=true;elapsed=0;score=0;done=0;miss=0;visitUntil=0;callUntil=0;activeCall=null;lastSpawn=0;lastTick=0;$('overlay').style.display='none';$('travel').classList.remove('show');startedAt=performance.now();add('plan');add('line');update();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function end(){running=false;cancelAnimationFrame(raf);$('travel').classList.remove('show');let rank=score>=1800?'多工傳說':score>=1150?'個管手速王':score>=650?'資深個管':'努力中的個管';$('modal').innerHTML='<h1>下班啦！</h1><h2>'+rank+'</h2><div class="scoreline">'+score+' 分</div><p>完成 '+done+' 件｜逾時 '+miss+' 件</p><p class="muted">45 秒固定挑戰・事件隨機出現</p><button id="again">再挑戰一次</button>';$('overlay').style.display='grid';$('again').onclick=start}types.forEach(k=>spots[k].onclick=()=>tap(k));$('start').onclick=start;})();
</script></body></html>
