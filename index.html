<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4d8bd"><title>個管手速王 V0.5｜多工辦公室</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#3b2929;touch-action:manipulation}button{font:inherit;cursor:pointer}#app{height:100dvh;width:min(100%,500px);margin:auto;position:relative;overflow:hidden;color:#59382d;background:#fff2e3}#app:before{content:'';position:absolute;inset:0 0 42%;background:url('office.png') center 39%/cover no-repeat;filter:blur(1.2px) saturate(.88)}#app:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#fff0d9e8 0%,#fff3e000 20%,#fff1e0a8 39%,#fff3e8 57%);pointer-events:none}.hud{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;display:flex;gap:7px}.stat{flex:1;border:1px solid #fff;background:#fff8f1ef;border-radius:16px;padding:8px 6px;text-align:center;box-shadow:0 3px 12px #65371d2b}.stat small{font-size:10px;color:#997362;font-weight:800;display:block}.stat strong{font-size:22px;display:block;line-height:1.15;font-variant-numeric:tabular-nums}.stress{height:7px;border-radius:20px;background:#e7d7c8;overflow:hidden;margin-top:6px}.stress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#78c68e,#ffbb50,#e85d51);transition:width .2s}.sceneTitle{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 94px);left:16px;background:#fff9edee;border-radius:16px;padding:7px 12px;box-shadow:0 3px 10px #57382125}.sceneTitle b{font-size:17px}.sceneTitle small{display:block;color:#a26d4f;font-size:10px}.bubble{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 158px);right:12px;max-width:54%;font-size:12px;font-weight:900;background:#fffaf0ed;padding:9px;border-radius:15px;box-shadow:0 3px 12px #57382140}.tasks{position:absolute;z-index:3;top:38%;left:10px;right:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.object{position:relative;border:2px solid #fff7e9;background:linear-gradient(145deg,#fffaf3f7,#f9e1c9f7);border-radius:18px;min-height:78px;padding:9px 4px 8px;color:#59382d;box-shadow:0 5px 0 #d3ac8d,0 7px 14px #77452228;font-weight:900}.object .emoji{display:block;font-size:27px;line-height:1.1}.object .label{display:block;font-size:12px;margin-top:4px}.object .num{position:absolute;top:-7px;right:-5px;border:2px solid white;background:#d95142;color:white;border-radius:40px;min-width:25px;height:25px;display:grid;place-items:center;font-size:12px}.object .num[hidden]{display:none}.object.sel{border-color:#ee9a43;background:#fff3d9}.object.urgent{animation:glow .65s alternate infinite}@keyframes glow{to{box-shadow:0 0 0 3px #f96b5c8c,0 5px 0 #d3ac8d}}.panel{position:absolute;z-index:4;bottom:calc(env(safe-area-inset-bottom) + 10px);left:10px;right:10px;height:clamp(235px,37dvh,325px);background:#fffaf4f7;border:2px solid #fff;border-radius:23px;box-shadow:0 8px 28px #4d302747;padding:13px;display:flex;flex-direction:column;gap:8px}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.panelHead b{font-size:17px}.deadline{font-size:12px;color:#b65945;font-weight:900}.subtitle{font-size:12px;color:#9b6f58;min-height:17px}.play{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice,.primary{border:2px solid #fff;background:#f5d7b7;color:#65402f;border-radius:15px;padding:12px 7px;min-height:52px;font-size:14px;font-weight:900;box-shadow:0 3px 0 #d4a884}.choice:active,.primary:active,.object:active{transform:translateY(2px)}.choice.correct{background:#d5ead7}.choice:disabled{opacity:.5}.primary{background:linear-gradient(#ffbf78,#ed9252);width:100%;font-size:17px}.chip{background:#f8eadb;border-radius:10px;padding:8px;font-size:12px;text-align:center}.progress{display:flex;gap:5px}.progress i{flex:1;height:7px;border-radius:9px;background:#e9d9c9}.progress i.done{background:#ec9c60}.dragArea{display:flex;align-items:center;justify-content:space-around;gap:12px}.dragCard{background:#f7bd76;border:2px solid white;border-radius:14px;padding:17px 8px;font-weight:900;touch-action:none;user-select:none;flex:1;text-align:center}.dropZone{background:#e0f0e4;border:2px dashed #80a78d;border-radius:14px;padding:17px 7px;font-weight:900;flex:1;text-align:center}.notice{position:absolute;z-index:7;top:calc(env(safe-area-inset-top) + 72px);left:18%;right:18%;text-align:center;background:#613b31ed;color:white;border-radius:12px;padding:8px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .2s}.notice.show{opacity:1}.overlay{position:absolute;z-index:10;inset:0;background:#36231cb8;display:flex;align-items:center;justify-content:center;padding:22px}.overlay.hide{display:none}.dialog{width:100%;background:#fff8eb;border:4px solid #fff;border-radius:25px;padding:23px;text-align:center;box-shadow:0 15px 35px #28151090}.dialog h1{font-size:27px;margin:0 0 12px}.dialog p{font-size:14px;line-height:1.75}.dialog button{width:100%;padding:14px;background:#ed995c;color:#4d2e22;border:2px solid white;border-radius:14px;font-size:18px;font-weight:900}.callBar{font-size:12px;background:#dcefe1;border-radius:10px;padding:7px;text-align:center;font-weight:800}.callBar.bad{background:#f9d9d0}.mini{font-size:12px;color:#936d5b;text-align:center}.mini strong{color:#c04b40}.toast{position:absolute;z-index:8;top:29%;left:15%;right:15%;text-align:center;background:#59372de8;color:#fff;border-radius:12px;padding:9px;font-weight:900;pointer-events:none;animation:up .95s forwards}@keyframes up{to{opacity:0;transform:translateY(-30px)}}@media(max-height:720px){.tasks{top:34%;gap:5px}.object{min-height:66px;padding:5px 2px}.object .emoji{font-size:22px}.panel{height:38dvh;padding:10px}.sceneTitle{top:calc(env(safe-area-inset-top) + 85px)}.bubble{top:calc(env(safe-area-inset-top) + 140px)}}
</style></head><body><main id="app"><div class="hud"><div class="stat"><small>剩餘時間</small><strong id="clock">00:45</strong></div><div class="stat"><small>得分</small><strong id="score">0</strong></div><div class="stat"><small>工作壓力 <span id="stressN">0%</span></small><div class="stress"><i id="stressBar"></i></div><small id="combo">COMBO ×0</small></div></div><div class="sceneTitle"><b>個管手速王</b><small>V0.5 · 多工辦公室</small></div><div class="bubble" id="bubble">今天應該能準時下班吧？</div><div class="tasks" id="objects"></div><section class="panel"><div class="panelHead"><b id="workTitle">工作處理區</b><span class="deadline" id="deadline"></span></div><div class="subtitle" id="sub">點擊上方物件，隨時切換工作</div><div class="play" id="play"></div><div id="callStatus"></div></section><div class="notice" id="notice"></div><div class="overlay" id="overlay"><div class="dialog"><h1 id="dialogTitle">個管手速王</h1><p id="dialogBody">45 秒挑戰：六種工作同時來！<br>依照不同位置的操作完成任務，進度可保留。<br>接電話時還能處理其他工作，異常事件請優先處理。</p><button id="go">開始上班！</button></div></div></main><script>
(()=>{'use strict';const $=s=>document.getElementById(s),keys=['plan','phone','line','visit','incident','budget'],info={plan:['💻','照顧計畫',150,16],phone:['☎️','室內電話',60,8],line:['💬','LINE',40,11],visit:['👜','家訪',240,17],incident:['🚨','異常事件',300,12],budget:['🧮','開額度',200,17]};let tasks={},all=[],id=0,selected=null,playing=false,time=45,score=0,combo=0,success=0,miss=0,last=0,spawnAt=0,visitEnd=0,call=null,noticeTimer,frame;const rand=n=>Math.floor(Math.random()*n);function task(t){return tasks[t][0]}function say(s){$('notice').textContent=s;$('notice').classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.remove('show'),1100)}function pop(s){let e=document.createElement('div');e.className='toast';e.textContent=s;$('app').append(e);setTimeout(()=>e.remove(),950)}function add(t){if(tasks[t].length>=(t==='line'?4:2))return;let e={id:++id,t,due:performance.now()+info[t][3]*1000,step:0,order:null,option:null,assigned:false};if(t==='plan')e.order=['確認需求','安排服務','送出計畫'];if(t==='incident')e.order=['聯繫確認','協調處理','完成通報'];tasks[t].push(e);all.push(e);if(t==='incident'||t==='phone')say(info[t][0]+' '+info[t][1]+'來了！');if(!selected)selected=t;draw()}function remove(e,ok){tasks[e.t]=tasks[e.t].filter(x=>x!==e);all=all.filter(x=>x!==e);if(ok){let pts=info[e.t][2]+Math.min(combo,7)*5;score+=pts;combo++;success++;pop('完成 +'+pts)}else{score=Math.max(0,score-Math.ceil(info[e.t][2]*.6));combo=0;miss++;pop('逾時！');if(e.t==='budget'&&Math.random()<.7)add('line');if(e.t==='incident'&&Math.random()<.6)add('phone')}if(!task(selected))selected=all[0]?.t||null;draw()}function button(label,fn,cl='choice'){let b=document.createElement('button');b.className=cl;b.textContent=label;b.onclick=fn;return b}function progress(e,max){let d=document.createElement('div');d.className='progress';for(let i=0;i<max;i++){let v=document.createElement('i');if(i<e.step)v.className='done';d.append(v)}return d}function chooseStep(e){let opts=[...e.order].sort(()=>Math.random()-.5),container=document.createElement('div');container.className='choices';opts.forEach(label=>container.append(button(label,()=>{if(label!==e.order[e.step]){say('順序不對，先做「'+e.order[e.step]+'」');return}e.step++;if(e.step>=e.order.length)remove(e,true);else drawPanel()})));return container}function drawPanel(){let title=$('workTitle'),sub=$('sub'),body=$('play'),dead=$('deadline');body.replaceChildren();let e=selected&&task(selected);if(!e){title.textContent='工作處理區';sub.textContent='點選上方六種物件，工作可自由切換';dead.textContent='';body.append(Object.assign(document.createElement('div'),{className:'chip',textContent:'電話、LINE、計畫、家訪、異常事件、額度：六種工作同時進行'}));return}title.textContent=info[e.t][0]+' '+info[e.t][1];dead.textContent='剩 '+Math.max(0,Math.ceil((e.due-performance.now())/1000))+' 秒';if(visitEnd){sub.textContent='家訪中，其他工作仍在累積';body.append(Object.assign(document.createElement('div'),{className:'chip',textContent:'🛵 正在家訪…剩 '+Math.max(0,(visitEnd-performance.now())/1000).toFixed(1)+' 秒'}));return}if(e.t==='plan'||e.t==='incident'){sub.textContent='選擇正確的下一步，按鈕位置每次都會變';body.append(progress(e,3),chooseStep(e));}else if(e.t==='line'){sub.textContent='訊息要點開、選擇回覆；不能只點同一處';if(!e.step){let choices=document.createElement('div');choices.className='choices';['📨 開啟訊息','🗂️ 先歸檔'].sort(()=>Math.random()-.5).forEach(x=>choices.append(button(x,()=>{if(x.startsWith('📨')){e.step=1;drawPanel()}else say('還沒回覆，不能歸檔')})));body.append(choices)}else{let c=document.createElement('div');c.className='choices';['💬 回覆收到','🔕 忽略訊息'].sort(()=>Math.random()-.5).forEach(x=>c.append(button(x,()=>x.startsWith('💬')?remove(e,true):say('要先回覆訊息'))));body.append(c)}}else if(e.t==='phone'){sub.textContent='接聽後可繼續處理其他工作';if(call){body.append(Object.assign(document.createElement('div'),{className:'chip',textContent:'通話中，可切換到其他工作'}));if(call.black){let b=button('在綠色時機按「結束通話」',()=>{if(performance.now()>=call.ready){let done=call.e;call=null;remove(done,true)}else{call.ready+=900;say('「啊！對了！還有一件事…」')}},'primary');body.append(b)}}else{let c=document.createElement('div');c.className='choices';['☎️ 接聽電話','🔇 靜音'].sort(()=>Math.random()-.5).forEach(x=>c.append(button(x,()=>{if(x.startsWith('☎️')){call={e,until:performance.now()+2500,black:false,ready:0};if(Math.random()<.35){call.black=true;call.until=performance.now()+6500;call.ready=performance.now()+2400}selected=all.find(v=>v!==e)?.t||null;say('通話中！可以繼續處理其他工作');draw()}else say('電話還在響！')})));body.append(c)}}else if(e.t==='visit'){sub.textContent='決定出發時機；外出期間辦公室工作會累積';body.append(button('🛵 出發家訪',()=>{visitEnd=performance.now()+3000;selected=null;say('出發家訪！');draw()},'primary'))}else if(e.t==='budget'){sub.textContent=e.step===0?'把額度卡拖曳到個案欄位': '確認額度分配並儲存';if(e.step===0){let area=document.createElement('div');area.className='dragArea';let card=document.createElement('div');card.className='dragCard';card.textContent='💰 本月額度';card.draggable=true;let zone=document.createElement('div');zone.className='dropZone';zone.textContent='👤 個案額度欄';card.addEventListener('dragstart',ev=>ev.dataTransfer.setData('text/plain','budget'));zone.addEventListener('dragover',ev=>ev.preventDefault());zone.addEventListener('drop',ev=>{ev.preventDefault();e.step=1;drawPanel()});let sx=0,sy=0;card.addEventListener('pointerdown',ev=>{sx=ev.clientX;sy=ev.clientY;card.setPointerCapture(ev.pointerId)});card.addEventListener('pointerup',ev=>{let r=zone.getBoundingClientRect();if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){e.step=1;drawPanel()}else if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>25)say('請拖到右邊個案欄位')});area.append(card,zone);body.append(area);body.append(Object.assign(document.createElement('div'),{className:'mini',textContent:'手指按住左邊額度卡，拖到右邊'}))}else{let c=document.createElement('div');c.className='choices';['💾 確認儲存','↩️ 重新分配'].sort(()=>Math.random()-.5).forEach(x=>c.append(button(x,()=>{if(x.startsWith('💾'))remove(e,true);else{e.step=0;drawPanel()}})));body.append(c)}}}function draw(){for(let t of keys){let el=$('obj-'+t),n=tasks[t].length;el.querySelector('.num').hidden=!n;el.querySelector('.num').textContent=n;el.classList.toggle('sel',selected===t);el.classList.toggle('urgent',n>0&&tasks[t][0].due-performance.now()<4500)}$('score').textContent=score.toLocaleString();$('combo').textContent='COMBO ×'+combo;drawPanel()}function spawn(elapsed){let types=elapsed<8?['plan','line','phone','visit']:elapsed<19?['plan','line','phone','visit','budget']:keys;let t=types[rand(types.length)];add(t);if(elapsed>31&&Math.random()<.3)add('line')}function tick(now){if(!playing)return;let dt=Math.min(.12,(now-last)/1000);last=now;time=Math.max(0,time-dt);let elapsed=45-time;spawnAt+=dt;if(spawnAt>(elapsed<8?3.1:elapsed<20?2.25:elapsed<33?1.75:1.35)){spawnAt=0;spawn(elapsed)}if(call&&now>=call.until&&!call.black){let e=call.e;call=null;if(all.includes(e))remove(e,true)}if(call&&call.black&&now>=call.until){let e=call.e;call=null;if(all.includes(e))remove(e,false)}if(visitEnd&&now>=visitEnd){visitEnd=0;let e=task('visit');if(e)remove(e,true)}for(let e of [...all])if(e.due<=now&&e!==call?.e&&!(e.t==='visit'&&visitEnd))remove(e,false);let pressure=Math.min(100,all.length*14+all.filter(e=>e.due-now<4500).length*12);$('clock').textContent='00:'+String(Math.ceil(time)).padStart(2,'0');$('stressBar').style.width=pressure+'%';$('stressN').textContent=pressure+'%';$('bubble').textContent=pressure>78?'救命！事情怎麼越來越多！':pressure>45?'電話先接？還是先處理異常？':'今天應該能準時下班吧？';$('callStatus').innerHTML=call?'<div class="callBar '+(call.black?'bad':'')+'">☎️ '+(call.black?'電話黑洞！可同時處理其他工作':'通話中，繼續多工')+'</div>':'';for(let t of keys){let e=task(t);$('obj-'+t).classList.toggle('urgent',!!e&&e.due-now<4500)}if(selected&&task(selected))$('deadline').textContent='剩 '+Math.max(0,Math.ceil((task(selected).due-now)/1000))+' 秒';if(visitEnd&&Math.floor(now/250)!==Math.floor((now-dt*1000)/250))drawPanel();if(time<=0){end();return}frame=requestAnimationFrame(tick)}function start(){tasks={};keys.forEach(k=>tasks[k]=[]);all=[];id=0;selected=null;playing=true;time=45;score=0;combo=0;success=0;miss=0;visitEnd=0;call=null;spawnAt=0;$('overlay').classList.add('hide');add('plan');add('line');last=performance.now();frame=requestAnimationFrame(tick)}function end(){playing=false;cancelAnimationFrame(frame);$('overlay').classList.remove('hide');$('dialogTitle').textContent=score>=1600?'🏆 多工達人！':score>=850?'✨ 資深個管！':'😵 今天也辛苦了';$('dialogBody').innerHTML='<b style="font-size:32px">'+score.toLocaleString()+' 分</b><br>完成 '+success+' 件｜逾時 '+miss+' 件<br><br>不是狂點就能過關，試著安排工作優先順序！';$('go').textContent='再挑戰 45 秒'}for(let t of keys){let b=document.createElement('button');b.id='obj-'+t;b.className='object';b.innerHTML='<span class="emoji">'+info[t][0]+'</span><span class="label">'+info[t][1]+'</span><span class="num" hidden>0</span>';b.onclick=()=>{if(!playing)return;if(visitEnd){say('家訪中，回來再處理辦公室工作');return}if(!task(t)){say('目前沒有這項待辦');return}selected=t;draw()};$('objects').append(b)}$('go').onclick=start;draw()})();
</script></body></html>
