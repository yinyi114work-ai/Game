<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>個管手速王 V0.3</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#563b32;background:#fae9d7}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{max-width:520px;min-height:100dvh;margin:auto;background:linear-gradient(#fff6e9,#f5d3b5);padding:12px;position:relative;overflow:hidden}.top{display:flex;gap:7px}.stat{flex:1;background:#fffaf2;border:2px solid #e7b38d;border-radius:14px;text-align:center;padding:7px 2px;box-shadow:0 3px #b87859}.stat small{display:block;font-size:11px;color:#976957}.stat b{font-size:22px}h1{font-size:21px;margin:15px 0 3px;text-align:center;color:#a95135}.sub{text-align:center;font-size:12px;color:#926d58;margin:0 0 9px}.office{height:min(58vh,485px);min-height:360px;position:relative;border:5px solid #fff8ef;border-radius:25px;background:linear-gradient(180deg,#f8d9aa 0 51%,#c88e65 51% 53%,#d7a077 53%);box-shadow:0 8px 0 #b97c60,0 10px 25px #9c644a55;overflow:hidden}.window{position:absolute;top:6%;left:7%;width:32%;height:24%;border:8px solid #fdf4dc;border-radius:14px;background:linear-gradient(#9bd8ed,#c6ecdc);box-shadow:0 3px #aa6d4c}.window:after{content:'☁️';position:absolute;top:12%;left:24%;font-size:30px}.shelf{position:absolute;right:6%;top:9%;font-size:32px}.desk{position:absolute;left:5%;right:5%;bottom:7%;height:43%;background:linear-gradient(#edbd85,#bd7952);border:5px solid #9b5d40;border-radius:30px 30px 16px 16px;box-shadow:0 9px #8d533c}.avatar{position:absolute;top:20%;left:40%;font-size:73px;filter:drop-shadow(0 4px 3px #875d4b55);transition:transform .25s}.avatar.stress{animation:wobble .45s infinite}.bubble{position:absolute;top:12%;left:37%;background:#fffdf6;border:2px solid #ddaa85;border-radius:16px;padding:7px 10px;font-size:12px;max-width:60%;z-index:3;box-shadow:0 3px #bc8a65}.obj{position:absolute;border:3px solid #fff7e9;border-radius:19px;background:linear-gradient(#fff9ed,#ffddac);box-shadow:0 5px #a56c50;padding:7px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:27%;height:25%;z-index:2;color:#5e3d30}.obj .em{font-size:36px}.obj strong{font-size:13px}.obj .count{font-size:11px;color:#a24c36}.obj.ready{border-color:#ff9c5c;animation:pulse .65s infinite alternate}.obj.urgent{border-color:#f15f62;animation:shake .22s infinite}.obj:disabled{opacity:.55;filter:grayscale(.5)}#pc{left:7%;bottom:34%}#phone{right:7%;bottom:34%}#mobile{left:5%;bottom:6%}#bag{left:36%;bottom:6%}#incident{right:5%;bottom:6%}#budget{right:35%;bottom:34%;transform:translateY(-94%);height:18%;min-width:28%}#budget .em{font-size:28px}.bottom{margin-top:14px;background:#fff8ed;border:2px solid #e6bb99;border-radius:16px;padding:10px}.pressure{height:10px;background:#efd8c7;border-radius:20px;overflow:hidden;margin-top:7px}.pressure i{display:block;background:linear-gradient(90deg,#edb35c,#e7655b);height:100%;width:0;transition:width .25s}.feed{height:37px;font-size:13px;padding:7px;color:#965d46;text-align:center;overflow:hidden}.overlay{position:absolute;inset:0;background:#4b3027b8;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:100%;max-height:90dvh;overflow:auto;background:linear-gradient(#fffdf6,#ffe1c3);border:6px solid white;border-radius:27px;padding:23px 18px;text-align:center;box-shadow:0 9px #6e3c2e}.modal h2{color:#ad5336;margin:8px 0 12px}.modal p{line-height:1.6}.primary{border:3px solid #fff;border-radius:17px;background:linear-gradient(#ffba62,#e77e32);color:#663720;font-weight:900;font-size:20px;padding:13px 25px;box-shadow:0 5px #ad6739}.choice{display:block;width:100%;background:#fff9ef;border:2px solid #e5af88;border-radius:13px;margin:9px 0;padding:12px;font-weight:700;color:#6e4638}.choice:active,.obj:active{transform:scale(.96)}.step{font-size:12px;color:#b47650}.hint{font-size:12px;color:#9c6b56}.track{height:20px;border-radius:20px;background:#eec6a5;position:relative;margin:16px 0;overflow:hidden}.target{position:absolute;left:39%;width:22%;height:100%;background:#75bb8e}.needle{position:absolute;top:0;bottom:0;width:7px;background:#b33e3b;left:0;transition:left .05s linear}.toast{position:absolute;top:85px;left:12%;right:12%;z-index:8;text-align:center;background:#fff3d8;border:2px solid #e69a67;border-radius:14px;padding:8px;font-size:14px;pointer-events:none}.hidden{display:none!important}@keyframes pulse{to{box-shadow:0 0 16px #ffb545,0 5px #a56c50}}@keyframes shake{25%{translate:2px 0}75%{translate:-2px 0}}@keyframes wobble{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}@media(max-height:740px){.office{height:52vh;min-height:330px}.avatar{font-size:60px}.obj{height:24%}.obj .em{font-size:29px}}
</style></head><body><main id="app"><div class="top"><div class="stat"><small>剩餘時間</small><b id="time">00:45</b></div><div class="stat"><small>分數</small><b id="score">0</b></div><div class="stat"><small>COMBO</small><b id="combo">×0</b></div></div><h1>個管手速王</h1><p class="sub">長照研究室 · 45秒辦公室大混亂</p><div class="office"><div class="window"></div><div class="shelf">🪴📚</div><div class="bubble" id="speech">今天應該很平靜吧？</div><div class="avatar" id="avatar">👩🏻‍💼</div><div class="desk"></div><button class="obj" id="pc" data-kind="plan"><span class="em">💻</span><strong>寫計畫</strong><span class="count"></span></button><button class="obj" id="phone" data-kind="phone"><span class="em">☎️</span><strong>室內電話</strong><span class="count"></span></button><button class="obj" id="mobile" data-kind="line"><span class="em">📱</span><strong>LINE</strong><span class="count"></span></button><button class="obj" id="bag" data-kind="visit"><span class="em">🧳</span><strong>家訪</strong><span class="count"></span></button><button class="obj" id="incident" data-kind="incident"><span class="em">🚨</span><strong>異常事件</strong><span class="count"></span></button><button class="obj" id="budget" data-kind="budget"><span class="em">🧮</span><strong>開額度</strong><span class="count"></span></button></div><div class="bottom"><div style="display:flex;justify-content:space-between;font-size:13px"><b>📋 待辦壓力</b><b id="load">0 件</b></div><div class="pressure"><i id="bar"></i></div><div class="feed" id="feed">點擊辦公室物件處理工作</div></div><div class="overlay" id="overlay"><div class="modal" id="modal"><div style="font-size:42px">👩🏻‍💼 ☎️ 📱</div><h2>個管手速王</h2><p>45 秒內處理不斷冒出的工作！<br>點擊辦公室物件完成任務。<br>電話會打斷計畫，家訪期間無法處理其他事情。</p><p class="hint">電話、LINE、家訪、計畫、異常事件與額度都會逾時扣分。遊戲內期限僅為模擬。</p><button class="primary" id="start">開始上班！</button></div></div><div id="toast" class="toast hidden"></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const types={plan:{label:'寫計畫',score:150,pen:150,ttl:13},visit:{label:'家訪',score:240,pen:200,ttl:15},phone:{label:'電話',score:60,pen:100,ttl:5},line:{label:'LINE',score:40,pen:60,ttl:7},incident:{label:'異常事件',score:300,pen:250,ttl:12},budget:{label:'開額度',score:200,pen:160,ttl:12}};let jobs=[],running=false,remaining=45,score=0,combo=0,completed=0,missed=0,callTime=0,stress=0,mode=null,active=null,step=0,seq=0,elapsed=0,spawnIn=2,blackholes=0,raf=0,last=0,needle=0,dir=1,phoneBusy=false,visitUntil=0,callStarted=0,toastTimer=0;const steps={plan:['評估需求','安排服務','送出計畫'],incident:['聯繫確認','協調處理','完成通報'],budget:['選擇個案','分配額度','確認儲存']};const messages=['怎麼又來了！','我才剛掛電話欸！','計畫還沒寫完啊！','這是什麼月初地獄！','先讓我喘口氣……'];function say(t){$('speech').textContent=t}function notify(t){$('feed').textContent=t;$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),1000)}function add(kind){if(jobs.filter(j=>j.kind===kind).length>=(kind==='line'?5:kind==='phone'?2:2))return;const t=types[kind];jobs.push({id:++seq,kind,deadline:elapsed+t.ttl,progress:0});notify((kind==='phone'?'鈴鈴鈴！':kind==='line'?'叮咚！':'新工作！')+t.label);render()}function render(){for(const k of Object.keys(types)){const el=$(k==='plan'?'pc':k==='visit'?'bag':k==='line'?'mobile':k==='phone'?'phone':k);const arr=jobs.filter(j=>j.kind===k);el.classList.toggle('ready',arr.length>0);el.classList.toggle('urgent',arr.some(j=>j.deadline-elapsed<2.5));el.querySelector('.count').textContent=arr.length?(arr.length+' 件'+(arr[0].progress?' · '+arr[0].progress+'/3':'')): '待命';el.disabled=!!(mode&&mode!=='visit'&&mode!=='phone'&&mode!=='blackhole') || (mode==='visit'&&k!=='visit')||(mode==='blackhole')||(mode==='phone') || (phoneBusy&&k==='plan');}const pending=jobs.length;stress=Math.min(100,pending*12+missed*7+(45-remaining)*.65);$('load').textContent=pending+' 件';$('bar').style.width=stress+'%';$('avatar').classList.toggle('stress',stress>55);$('avatar').textContent=stress>85?'😵‍💫':stress>60?'😰':stress>32?'😟':'👩🏻‍💼';$('time').textContent='00:'+String(Math.ceil(remaining)).padStart(2,'0');$('score').textContent=Math.max(0,Math.round(score));$('combo').textContent='×'+combo;if(stress>70&&Math.random()<.02)say(messages[Math.floor(Math.random()*messages.length)])}function done(j,bonus=0){jobs=jobs.filter(x=>x!==j);combo++;completed++;const mult=combo>=10?2:combo>=6?1.5:combo>=3?1.2:1;score+=Math.round((types[j.kind].score+bonus)*mult);mode=null;active=null;step=0;notify('完成 '+types[j.kind].label+'！ +'+Math.round((types[j.kind].score+bonus)*mult));render()}function fail(j){jobs=jobs.filter(x=>x!==j);score-=types[j.kind].pen;combo=0;missed++;if(active===j){mode=null;active=null;hideModal()}notify(types[j.kind].label+'逾時！ −'+types[j.kind].pen)}function hideModal(){$('overlay').classList.add('hidden')}function showModal(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}function clickKind(k){if(!running)return;if(mode==='visit'&&k==='visit'){advanceVisit();return}if(mode)return;const j=jobs.find(x=>x.kind===k);if(!j){notify('目前沒有'+types[k].label+'待辦');return}if(k==='plan'&&jobs.some(x=>x.kind==='phone')){notify('☎️ 電話正在響！先接電話');return}active=j;if(k==='line'){done(j);return}if(k==='phone'){phoneBusy=true;if(Math.random()<.38&&blackholes<2){blackholes++;mode='blackhole';callStarted=elapsed;needle=0;dir=1;showBlackhole()}else{mode='phone';showModal('<div style="font-size:45px">☎️</div><h2>通話中……</h2><p>「個管您好，想跟您確認一下服務……」</p><button class="primary" id="hang">確認並結束通話</button>');$('hang').onclick=()=>{hideModal();phoneBusy=false;done(j)}}return}if(k==='visit'){mode='visit';step=0;showModal('<div style="font-size:46px">🧳</div><h2>準備出發家訪</h2><p>向右滑動下方滑桿，出發後需完成家訪，其他工作暫時無法操作。</p><input id="slide" type="range" min="0" max="100" value="0" style="width:95%;accent-color:#e98b44"><p class="hint">滑到最右邊出發</p>');$('slide').oninput=e=>{if(+e.target.value>=95){hideModal();visitUntil=elapsed+3.1;step=1;say('我出門家訪了！');notify('家訪進行中……其他工作暫停操作');render()}};return}mode=k;step=j.progress||0;showSteps()}
function advanceVisit(){if(elapsed<visitUntil){notify('家訪中，還要 '+Math.ceil(visitUntil-elapsed)+' 秒');return}done(active);say('我回來了！怎麼這麼多通知！')}
function showSteps(){const list=steps[mode];showModal('<div style="font-size:43px">'+({plan:'💻',incident:'🚨',budget:'🧮'}[mode])+'</div><h2>'+types[mode].label+'</h2><p class="hint">每一步都有意義，依序完成工作</p>'+list.map((x,i)=>'<button class="choice" data-step="'+i+'" '+(i!==step?'disabled style="opacity:.45"':'')+'>'+(i<step?'✓ ':i===step?'👉 ':'○ ')+x+'</button>').join('')+'<p class="step">'+step+' / '+list.length+'</p><button class="choice" id="back">先返回辦公室（保留進度）</button>');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{if(+b.dataset.step!==step)return;step++;active.progress=step;if(step>=list.length){hideModal();done(active)}else showSteps()});$('back').onclick=()=>{mode=null;active=null;hideModal();render()}}
function showBlackhole(){showModal('<div style="font-size:45px">😵‍💫 ☎️</div><h2>電話黑洞！</h2><p>「啊我跟妳說齁……我昨天遇到隔壁阿珠……」</p><p class="hint">抓準指針進入綠色區域時，按下收尾！</p><div class="track"><div class="target"></div><div class="needle" id="needle"></div></div><button class="primary" id="endcall">溫柔收尾</button><p id="callnote" class="hint">其他工作仍在倒數……</p>');$('endcall').onclick=()=>{if(needle>=39&&needle<=61){callTime+=elapsed-callStarted;phoneBusy=false;hideModal();done(active,50);say('終於掛電話了！')}else{score-=20;combo=0;$('callnote').textContent='「妳先聽我說完啦！」−20 分，繼續聽……';needle=0;render()}}}
function start(){jobs=[];running=true;remaining=45;score=0;combo=0;completed=0;missed=0;callTime=0;stress=0;mode=null;active=null;step=0;seq=0;elapsed=0;spawnIn=2;blackholes=0;phoneBusy=false;last=0;hideModal();say('今天應該很平靜吧？');add('plan');add('visit');render();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function end(){running=false;cancelAnimationFrame(raf);for(const j of [...jobs]){score-=Math.round(types[j.kind].pen/2)}score=Math.max(0,score);const title=missed>=5?'待辦地獄居民':completed>=15?'傳說級長照八爪魚':completed>=9?'多工救火隊':'加班邊緣人';const best=Number(localStorage.getItem('caseRushBestV03')||0);if(score>best)localStorage.setItem('caseRushBestV03',String(Math.round(score)));showModal('<div style="font-size:48px">🏆</div><h2>45 秒下班結算</h2><p><strong style="font-size:30px;color:#ad5336">'+Math.round(score)+'</strong> 分</p><p>稱號：<b>'+title+'</b></p><p>完成 '+completed+' 件｜逾時 '+missed+' 件<br>電話黑洞 '+blackholes+' 次｜最高紀錄 '+Math.max(best,Math.round(score))+' 分</p><button class="primary" id="again">再上班一次！</button>');$('again').onclick=start}
function tick(ts){if(!running)return;if(!last)last=ts;let dt=Math.min(.1,(ts-last)/1000);last=ts;elapsed+=dt;remaining=Math.max(0,45-elapsed);if(mode==='blackhole'){needle+=dir*dt*92;if(needle>=100){needle=100;dir=-1}if(needle<=0){needle=0;dir=1}const n=$('needle');if(n)n.style.left=needle+'%';if(elapsed-callStarted>6){callTime+=elapsed-callStarted;phoneBusy=false;hideModal();done(active);say('這通電話終於結束了……')}}if(mode==='visit'&&step===1&&elapsed>=visitUntil){step=2;notify('家訪完成！點訪視包返回辦公室');say('訪視結束，準備回辦公室')}
for(const j of [...jobs])if(elapsed>=j.deadline){if(mode==='visit'&&j.kind!=='visit'){j.deadline+=dt;continue}if(mode==='blackhole'&&j.kind==='phone'&&j===active){j.deadline+=dt;continue}fail(j)}if(!jobs.some(j=>j.kind==='phone')&&mode!=='blackhole'&&mode!=='phone')phoneBusy=false;spawnIn-=dt;if(spawnIn<=0){const pool=elapsed<8?['plan','visit','line','phone']:elapsed<19?['plan','visit','line','line','phone','budget']:['plan','visit','line','line','phone','phone','incident','budget'];add(pool[Math.floor(Math.random()*pool.length)]);spawnIn=elapsed<8?2.8:elapsed<20?1.9:elapsed<32?1.25:.85}if(remaining<=0){end();return}render();raf=requestAnimationFrame(tick)}document.querySelectorAll('.obj').forEach(b=>b.addEventListener('click',()=>clickKind(b.dataset.kind)));$('start').addEventListener('click',start);})();
</script></body></html>
