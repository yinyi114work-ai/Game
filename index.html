<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f6c89e"><title>個管手速王 V2.0｜極限多工</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#302532;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;touch-action:none}#shell{position:relative;width:min(100vw,calc(100dvh * .60));height:100dvh;margin:auto;overflow:hidden;background:#f7d9b7;box-shadow:0 0 70px #0008}canvas{width:100%;height:100%;display:block;touch-action:none}#start,#end{position:absolute;inset:0;background:linear-gradient(#302437bd,#38252ce6);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:28px;color:white;text-align:center;z-index:5}#end{display:none}.panel{background:#fff8ed;box-shadow:0 12px 35px #351d2377;border:4px solid #fff;border-radius:28px;padding:24px 18px;width:100%;max-width:370px;color:#6b382e}.panel h1{font-size:32px;line-height:1.2;margin:8px 0;color:#a34b27;text-shadow:0 2px white}.panel h2{margin:0 0 12px;font-size:27px;color:#a34b27}.panel p{line-height:1.6;font-size:14px}.btn{border:0;background:linear-gradient(#ffb14d,#e77533);border-radius:16px;padding:14px 22px;color:white;font-weight:900;font-size:20px;box-shadow:0 5px 0 #aa4e29;width:100%;touch-action:manipulation}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stats>div{border-radius:13px;background:#f6e6d6;padding:12px 3px}.stats b{display:block;font-size:27px}.stats small{font-size:12px}.note{font-size:12px;color:#976a5c}.overlay{position:absolute;inset:0;background:#331b26e9;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:4;gap:15px}.overlay strong{font-size:32px}.overlay p{font-size:17px;text-align:center}.overlay .big{font-size:88px;animation:walk .4s infinite alternate}@keyframes walk{from{transform:translateX(-20px) rotate(-5deg)}to{transform:translateX(20px) rotate(5deg)}}#toast{position:absolute;top:110px;left:50%;transform:translateX(-50%);background:#4b2a2ddf;border:2px solid #fff9;color:white;border-radius:16px;padding:9px 15px;max-width:92%;text-align:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .15s;font-size:14px;font-weight:800}#toast.show{opacity:1}@media(max-height:680px){.panel{padding:14px}.panel h1{font-size:27px}}
</style></head><body><div id="shell"><canvas id="game"></canvas><div id="toast"></div><div id="visit" class="overlay"><strong>家訪進行中</strong><div class="big">🚶🏻‍♀️</div><p>正在關心長輩、評估需求……<br>辦公室工作持續累積！</p><b id="visitLeft">3</b></div><div id="start"><div class="panel"><div style="font-size:52px">👩🏻‍💼⚡</div><h1>個管手速王</h1><b>V2.0・極限多工辦公室</b><p>60 秒內，直接點擊發光的辦公物件！<br>電話中只能回 LINE、開額度。<br>電話未結束不能出發家訪。<br>最後 3 秒會倒數，逾時就 MISS！</p><button class="btn" id="go">開始上班！</button><p class="note">前 30 秒逐漸加速，後 30 秒地獄級密集<br>壓力達 100% 立即 Burnout</p></div></div><div id="end"><div class="panel"><div style="font-size:45px" id="endIcon">🏆</div><h2 id="endTitle">挑戰結束</h2><div id="endReason" style="font-size:14px"></div><div class="stats"><div><small>完成</small><b id="doneN">0</b></div><div><small>MISS</small><b id="missN">0</b></div><div><small>未完成</small><b id="leftN">0</b></div></div><h2 id="finalScore">0 分</h2><button class="btn" id="again">再挑戰一次</button></div></div></div>
<script>
(()=>{'use strict';
const C=document.getElementById('game'),ctx=C.getContext('2d'),W=420,H=760;
const $=id=>document.getElementById(id);
const work={
plan:{name:'照顧計畫',x:76,y:372,w:115,h:112,color:'#55bdf4',steps:['確認需求','安排服務','送出計畫'],limit:13,score:150},
phone:{name:'室內電話',x:328,y:351,w:112,h:85,color:'#ff875e',steps:['接聽電話'],limit:7,score:70},
line:{name:'LINE',x:315,y:485,w:85,h:112,color:'#6fdc80',steps:['閱讀訊息','快速回覆'],limit:10,score:55},
incident:{name:'異常事件',x:209,y:573,w:114,h:96,color:'#ff6b62',steps:['聯繫確認','協調處理','完成通報'],limit:11,score:260},
budget:{name:'開額度',x:85,y:590,w:119,h:91,color:'#ffc54b',steps:['確認額度','開立完成'],limit:14,score:180},
visit:{name:'家訪',x:339,y:604,w:114,h:105,color:'#ffbc72',steps:['出發家訪'],limit:14,score:240}
};
let running=false,elapsed=0,prev=0,spawnAt=0,tasks={},seq=0,done=0,miss=0,score=0,stress=0,call=null,visitEnd=0,toastTimer=0,particles=[],events=[],shake=0,blink=0,stressFlash=0;
const rand=(a,b)=>a+Math.random()*(b-a);
const rr=(x,y,w,h,r,fill,stroke,lw=1)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}};
function txt(s,x,y,size=16,color='#fff',align='center',weight=800){ctx.font=`${weight} ${size}px system-ui,"Noto Sans TC",sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function poly(pts,fill){ctx.beginPath();ctx.moveTo(...pts[0]);pts.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function grad(x,y,x2,y2,a,b){const g=ctx.createLinearGradient(x,y,x2,y2);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1100)}
function burst(x,y,s,color='#ffe577'){for(let i=0;i<9;i++)particles.push({x,y,vx:rand(-85,85),vy:rand(-135,-40),life:.65,color,s})}
function make(k){const a=work[k];if(!tasks[k])tasks[k]=[];if(tasks[k].length>=3)return;tasks[k].push({id:++seq,step:0,deadline:elapsed+a.limit,kind:k,created:elapsed});burst(a.x,a.y,'!',a.color);if(k==='phone')toast('叮鈴鈴！電話來了！')}
function pending(){return Object.values(tasks).reduce((s,a)=>s+a.length,0)+(call?1:0)}
function phaseInterval(t){if(t<15)return rand(2.0,2.8);if(t<30)return rand(1.2,1.9);if(t<45)return rand(.65,1.05);return rand(.36,.68)}
function spawn(){const pool=elapsed<15?['plan','phone','line','budget','visit']:elapsed<30?['plan','phone','line','budget','visit','incident']:['plan','phone','line','budget','visit','incident','line','phone','incident'];let k=pool[Math.floor(Math.random()*pool.length)];if(tasks[k]?.length>=3){k=pool.find(x=>(tasks[x]?.length||0)<3)||k}make(k);if(elapsed>30&&Math.random()<.21)make(['line','phone','incident'][Math.floor(Math.random()*3)])}
function finish(k){const t=tasks[k].shift();if(!t)return;done++;score+=work[k].score;stress=Math.max(0,stress-5);burst(work[k].x,work[k].y,'+'+work[k].score,'#fff19a');toast(work[k].name+' 完成！')}
function doMiss(k){const t=tasks[k].shift();if(!t)return;miss++;score=Math.max(0,score-80);stress=Math.min(100,stress+10);shake=.28;burst(work[k].x,work[k].y,'MISS','#ff4343');events.push({s:'MISS!',x:work[k].x,y:work[k].y-30,life:1.05});}
function act(k){
if(!running||visitEnd)return;
const a=tasks[k];if((!a||!a.length)&&!(k==='phone'&&call)){toast('目前沒有'+work[k].name+'待辦');return}
if(call&& !['line','budget','phone'].includes(k)){toast('通話中！只能回 LINE 或開額度');shake=.12;return}
if(k==='phone'){
 if(call){if(call.canEnd){call=null;done++;score+=70;stress=Math.max(0,stress-4);burst(work.phone.x,work.phone.y,'+70');toast('電話結束！')}else{toast('對方還在講……');shake=.08}return}
 const t=a.shift();if(!t)return;
 const black=Math.random()<.42;
 call={black,until:elapsed+(black?rand(5.5,8.5):rand(1.7,2.7)),canEnd:false,nextLine:elapsed+1.6,stage:0};
 toast(black?'電話黑洞！「啊！對了……」':'通話中，請稍候收尾');
 return;
}
if(k==='visit'){if(call){toast('電話未結束，不能出發家訪！');return}const t=a.shift();if(!t)return;visitEnd=elapsed+3.1;$('visit').style.display='flex';toast('出發家訪！');return}
const t=a[0];t.step++;burst(work[k].x,work[k].y,work[k].steps[Math.min(t.step-1,work[k].steps.length-1)],work[k].color);
if(t.step>=work[k].steps.length)finish(k);
}
function end(burn){running=false;$('visit').style.display='none';$('end').style.display='flex';$('endTitle').textContent=burn?'BURNOUT！':'下班啦！';$('endIcon').textContent=burn?'😵‍💫':'🏆';$('endReason').textContent=burn?'壓力達 100%，提前結束挑戰':'60 秒挑戰完成';$('doneN').textContent=done;$('missN').textContent=miss;$('leftN').textContent=pending();$('finalScore').textContent=score.toLocaleString()+' 分'}
function start(){running=true;elapsed=0;prev=performance.now();spawnAt=1.1;tasks={};seq=0;done=0;miss=0;score=0;stress=0;call=null;visitEnd=0;particles=[];events=[];shake=0;blink=0;$('start').style.display='none';$('end').style.display='none';$('visit').style.display='none';make('plan');make('line');requestAnimationFrame(frame)}
function update(dt){
elapsed+=dt;blink+=dt;shake=Math.max(0,shake-dt);
if(elapsed>=spawnAt){spawn();spawnAt=elapsed+phaseInterval(elapsed)}
for(const k of Object.keys(tasks)){while(tasks[k].length&&tasks[k][0].deadline<=elapsed)doMiss(k)}
if(call){if(call.black&&elapsed>call.nextLine&&elapsed<call.until){call.stage++;call.nextLine=elapsed+1.6;toast(['啊！對了！','還有一件事……','等一下喔！','最後再問一下……'][call.stage%4]);stress=Math.min(100,stress+1.8)}if(elapsed>=call.until&&!call.canEnd){call.canEnd=true;toast('電話可以收尾了！點電話結束')}}
if(visitEnd){$('visitLeft').textContent=Math.max(1,Math.ceil(visitEnd-elapsed));if(elapsed>=visitEnd){visitEnd=0;$('visit').style.display='none';done++;score+=240;burst(work.visit.x,work.visit.y,'+240');toast('家訪完成，回到辦公室！')}}
const near=Object.values(tasks).flat().filter(t=>t.deadline-elapsed<=3).length;
stress=Math.max(0,Math.min(100,stress+dt*(.22+pending()*.29+(elapsed>30?.23:0))+near*dt*.52));
particles=particles.filter(p=>(p.life-=dt)>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt}
events=events.filter(e=>(e.life-=dt)>0);for(const e of events)e.y-=18*dt;
if(stress>=100){end(true);return}if(elapsed>=60){end(false);return}
}
function deskObject(k){const a=work[k],x=a.x,y=a.y,t=elapsed;const active=(tasks[k]?.length||0)>0||(k==='phone'&&call);const pulse=.5+.5*Math.sin(t*8);
ctx.save();ctx.translate(x,y);
if(active){ctx.shadowColor=a.color;ctx.shadowBlur=15+pulse*15;ellipse(0,8,a.w*.51,a.h*.43,a.color+'66');ctx.shadowBlur=0}
if(k==='plan'){
 rr(-52,-55,104,100,12,grad(0,-55,0,45,'#424b67','#242b43'),'#bdc9d7',5);
 rr(-43,-45,86,71,7,grad(0,-45,0,26,'#2d4d70','#76b8d1'));
 for(let i=0;i<4;i++)rr(-32,-30+i*15,48+(i%2)*14,6,3,i===2?'#f3c75c':'#c5f0fa');
 rr(-34,43,68,9,4,'#7b8097');txt('照顧計畫',0,10,14,'#fff');
}else if(k==='phone'){
 const wob=active?Math.sin(t*25)*2:0;ctx.translate(wob,0);
 rr(-49,-24,98,54,12,grad(0,-24,0,30,'#fa8c6c','#b84d4a'),'#ffe1c8',3);
 rr(-46,-35,92,20,10,'#ae4446');rr(-25,-11,45,14,3,'#d8e4d9');
 for(let i=0;i<9;i++)rr(-28+i%3*17,7+Math.floor(i/3)*9,11,6,2,'#ffe4d0');
 txt('☎',0,-31,25,'#fff');
}else if(k==='line'){
 ctx.rotate(-.09);rr(-35,-56,70,112,14,'#31394b','#e6c9a6',4);rr(-29,-49,58,94,8,grad(0,-49,0,45,'#71d887','#209f67'));
 txt('LINE',0,-10,22,'#fff');txt('● ● ●',0,17,15,'#fff');
}else if(k==='budget'){
 poly([[-59,-31],[45,-37],[59,37],[-51,42]],'#5b697b');poly([[-51,-28],[38,-31],[49,31],[-43,35]],grad(0,-30,0,40,'#f5d9aa','#bdc4cf'));
 rr(-27,-22,53,24,5,'#4e6577');txt('＄',0,-10,18,'#ffde66');
 for(let i=0;i<6;i++)ellipse(-23+i%3*20,10+Math.floor(i/3)*13,7,6,'#e9a943');
}else if(k==='incident'){
 ctx.rotate(-.05);rr(-56,-46,112,92,8,grad(0,-46,0,46,'#ff9d6c','#d44b42'),'#ffdfb2',4);
 rr(-14,-57,28,17,5,'#f7c6a3');txt('!',0,-10,42,'#fff');txt('異常事件',0,27,16,'#fff');
}else if(k==='visit'){
 poly([[-48,-37],[47,-37],[55,43],[-56,43]],grad(0,-37,0,43,'#d89b53','#9e5b2e'));
 ctx.strokeStyle='#774020';ctx.lineWidth=9;ctx.beginPath();ctx.arc(0,-34,29,Math.PI,0);ctx.stroke();
 rr(-40,-28,80,61,8,'#bd783b','#f4bf74',3);txt('家訪',0,2,23,'#fff');
}
if(active){ctx.shadowColor=a.color;ctx.shadowBlur=18;ctx.lineWidth=4;ctx.strokeStyle=a.color;ctx.beginPath();ctx.roundRect(-a.w*.49,-a.h*.5,a.w*.98,a.h*.98,16);ctx.stroke();ctx.shadowBlur=0;
const n=(tasks[k]?.length||0);if(n){ellipse(a.w*.39,-a.h*.40,17,17,'#e64f47');txt(n,a.w*.39,-a.h*.40,17,'#fff')}
const t0=tasks[k]?.[0];if(t0){let rem=t0.deadline-elapsed;if(rem<=3){txt(String(Math.max(1,Math.ceil(rem))),0,-a.h*.59,29,'#ff403b');}else if(t0.step){txt(`${t0.step}/${work[k].steps.length}`,0,a.h*.50,14,'#fff')}}
}
if(k==='phone'&&call){txt(call.canEnd?'點擊掛斷':call.black?'電話黑洞…':'通話中',0,61,14,'#fff');}
ctx.restore();
}
function drawWoman(){
const t=elapsed,an=running?Math.sin(t*3)*2:0,ex=stress>75?1:0;
ctx.save();ctx.translate(206+an,350);
ellipse(0,75,65,15,'#53382b44');
rr(-56,-22,113,105,40,grad(0,-22,0,83,'#e5a65b','#bd673f'));
poly([[-25,-19],[0,21],[24,-19]],'#fff6eb');rr(-8,12,16,47,4,'#e68d3f');
ctx.save();ctx.translate(-46,23);ctx.rotate(Math.sin(t*7)*.08);rr(-12,-8,26,68,13,'#df9851');ellipse(0,54,14,12,'#f7c5a4');ctx.restore();
ctx.save();ctx.translate(45,24);ctx.rotate(Math.sin(t*6+2)*.10);rr(-12,-8,26,65,13,'#df9851');ellipse(0,51,14,12,'#f7c5a4');ctx.restore();
ellipse(0,-76,66,73,'#7b4235');ellipse(0,-69,53,61,'#f9c8a6');
ellipse(-20,-66,9,12,'#fff');ellipse(20,-66,9,12,'#fff');
ellipse(-19,-65,5,7,'#3b2b31');ellipse(20,-65,5,7,'#3b2b31');
if(Math.sin(t*2.5)> .993){rr(-29,-66,20,3,2,'#4c3030');rr(11,-66,20,3,2,'#4c3030')}
ctx.strokeStyle='#603b32';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-31,-89);ctx.quadraticCurveTo(-20,-96,-11,-89);ctx.moveTo(9,-89);ctx.quadraticCurveTo(20,-97,31,-89);ctx.stroke();
ellipse(-35,-44,12,6,'#ee9c8b88');ellipse(35,-44,12,6,'#ee9c8b88');
ctx.beginPath();ctx.arc(0,-41,stress>55?9:5,0,Math.PI);ctx.strokeStyle='#a64b4c';ctx.lineWidth=3;ctx.stroke();
poly([[-57,-94],[-60,-128],[-38,-149],[-9,-142],[20,-151],[55,-127],[56,-97],[36,-118],[9,-130],[-22,-116]],'#7b4436');
ellipse(-45,-117,24,19,'#8c503b');ellipse(36,-128,25,20,'#8c503b');
if(stress>40){ellipse(46,-61,5,10,'#71d7f6');if(stress>75){ellipse(-44,-48,5,9,'#71d7f6')}}
if(stress>87){txt('😵',0,-170,30)}
ctx.restore();
}
function draw(){
ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate(rand(-4,4),rand(-3,3));
ctx.fillStyle=grad(0,0,0,H,'#f5d9b8','#d58c5e');ctx.fillRect(0,0,W,H);
rr(0,100,420,245,0,'#f3c89f');
rr(26,125,175,193,13,'#e8a878','#fff0d5',8);rr(36,135,155,172,8,grad(0,135,0,310,'#a8d9e7','#e9f6e8'));poly([[36,260],[191,260],[191,307],[36,307]],'#98c8a0');rr(111,135,8,172,0,'#f4d4ac');
rr(286,127,112,171,10,'#ad7852','#fce1ba',7);rr(296,138,92,150,6,'#f5dfb7');txt('今日重點',342,161,15,'#86503b');['計畫','額度','家訪','異常'].forEach((x,i)=>{txt('✓ '+x,339,190+i*27,15,'#9b6749')});
rr(7,228,88,117,8,'#c18b60');for(let i=0;i<4;i++){rr(13+i*20,240,15,91,2,['#efb877','#d88b7a','#9cc5bd','#f1d28e'][i])}
poly([[0,493],[420,493],[420,760],[0,760]],grad(0,493,0,760,'#e4a76b','#a75f3e'));
poly([[0,480],[420,463],[420,522],[0,547]],'#f6c38a');
ctx.save();ctx.globalAlpha=.17;for(let i=0;i<10;i++)rr(i*55,535,2,225,0,'#4b211a');ctx.restore();
drawWoman();
Object.keys(work).forEach(deskObject);
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);txt(p.s,p.x,p.y,14,p.color);ctx.globalAlpha=1}
for(const e of events){ctx.globalAlpha=Math.min(1,e.life);txt(e.s,e.x,e.y,29,'#ff2929');ctx.globalAlpha=1}
ctx.restore();
rr(8,8,404,94,19,'#593c42ed','#fff0d9',2);
txt('個管手速王',18,30,19,'#ffe2a3','left');txt('V2.0 極限多工',18,54,11,'#ffe4ce','left');
txt('⏱ '+String(Math.max(0,Math.ceil(60-elapsed))).padStart(2,'0')+'s',270,33,26,'#fff');
txt('★ '+score,365,72,18,'#fff');
rr(15,78,180,12,6,'#2b2630');rr(15,78,180*stress/100,12,6,stress>80?'#ff4141':stress>50?'#f4a647':'#70d38b');
txt('壓力 '+Math.floor(stress)+'%',205,84,11,'#fff','left');
txt('MISS '+miss,270,73,15,'#ffc4c0');
if(elapsed>=30){rr(126,108,168,27,13,'#a52736dd');txt(elapsed<45?'⚠ 地獄模式':'🔥 極限地獄',210,121,14,'#fff')}
if(call){rr(105,136,211,32,14,call.canEnd?'#4e9e69dd':'#9d4c46dd');txt(call.canEnd?'☎ 可以收尾！點電話':'☎ '+(call.black?'電話黑洞・還在講…':'通話中…'),210,151,13,'#fff')}
if(stress>=60){const intensity=(stress-60)/40;ctx.strokeStyle=`rgba(239,35,48,${(.14+intensity*.48)*(.65+.35*Math.sin(elapsed*(stress>85?10:4)))})`;ctx.lineWidth=12+intensity*16;ctx.strokeRect(5,5,410,750)}
rr(9,701,402,50,14,'#553b41ed','#ffead7',2);
txt('直接點擊發光物件｜電話中只能回 LINE、開額度',210,718,12,'#fff');
txt('完成 '+done+'　 MISS '+miss+'　待辦 '+pending(),210,739,12,'#ffe1bd');
}
function frame(now){if(!running)return;let dt=Math.min(.06,(now-prev)/1000);prev=now;update(dt);draw();if(running)requestAnimationFrame(frame)}
function coords(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
C.addEventListener('pointerdown',e=>{e.preventDefault();const p=coords(e);const hits=Object.entries(work).filter(([k,a])=>Math.abs(p.x-a.x)<a.w*.52&&Math.abs(p.y-a.y)<a.h*.52);if(hits.length){hits.sort((a,b)=>Math.hypot(p.x-a[1].x,p.y-a[1].y)-Math.hypot(p.x-b[1].x,p.y-b[1].y));act(hits[0][0])}});
