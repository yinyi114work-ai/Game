<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#a75d35"><title>個管手速王 V0.4｜多工大作戰</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#3c2823;color:#fff;touch-action:manipulation}button{font:inherit;cursor:pointer}#game{position:relative;height:100dvh;width:min(100vw,560px);margin:auto;overflow:hidden;background:#c18d6a url('office.png') center center/100% 100% no-repeat;isolation:isolate}#game:before{content:"";position:absolute;inset:0;background:linear-gradient(#2d191db8 0%,transparent 20%,transparent 71%,#241b21a8 100%);pointer-events:none;z-index:1}.top{position:absolute;top:env(safe-area-inset-top);left:3%;right:3%;z-index:5;display:flex;gap:6px;align-items:center;padding-top:7px}.stat{flex:1;text-align:center;background:#56352fe8;border:2px solid #f3cba1;border-radius:15px;padding:5px 3px;box-shadow:0 4px 12px #321c1670}.stat small{display:block;font-size:10px;font-weight:800}.stat strong{display:block;font-size:23px;line-height:1.15}.pressure{height:8px;background:#392420;border-radius:10px;overflow:hidden;margin:3px 4px}.pressure i{display:block;width:0%;height:100%;background:linear-gradient(90deg,#68d37b,#ffce54,#f04c45);transition:width .3s}.brand{position:absolute;top:calc(env(safe-area-inset-top) + 75px);left:4%;z-index:2;font-weight:1000;text-shadow:0 3px 3px #4a291c,0 0 12px #4a291c;font-size:clamp(18px,5vw,27px)}.brand span{display:block;font-size:12px;color:#ffe0a2}.hotspot{position:absolute;z-index:3;border:2px solid #ffe5b4d9;background:#30202a44;box-shadow:0 0 0 3px #ffb14c35,0 0 22px #ffba47a8;border-radius:17px;color:#fff;font-weight:900;text-shadow:0 2px 4px #2c1618;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:58px;min-height:56px;transition:transform .12s,filter .12s}.hotspot:active{transform:scale(.93)}.hotspot .name{font-size:clamp(11px,3vw,15px);background:#352321c9;padding:3px 6px;border-radius:9px;white-space:nowrap}.hotspot .count{position:absolute;right:-7px;top:-10px;border-radius:100px;background:#e8473b;border:2px solid white;min-width:27px;height:27px;display:grid;place-items:center;font-size:14px;box-shadow:0 3px 8px #521f1f8c}.hotspot.attention{animation:pulse .65s infinite alternate}@keyframes pulse{to{filter:brightness(1.4);box-shadow:0 0 0 5px #ffbb41a0,0 0 26px #ff5b37}}#plan{left:4%;top:42%;width:25%;height:15%}#phone{right:4%;top:39%;width:24%;height:13%}#line{right:22%;top:54%;width:20%;height:11%}#visit{right:3%;top:64%;width:22%;height:13%}#incident{left:39%;top:63%;width:24%;height:13%}#budget{left:8%;top:64%;width:25%;height:12%}.bottom{position:absolute;z-index:6;bottom:calc(env(safe-area-inset-bottom) + 7px);left:3%;right:3%;background:#49302ae8;border:2px solid #ffe0bb;border-radius:22px;padding:9px;box-shadow:0 5px 20px #1f1011a0;min-height:119px}.bottom-title{font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}.bottom-title span{color:#ffdb9b;font-size:12px}.task-content{display:flex;gap:7px;margin-top:8px;align-items:stretch;min-height:58px}.task-content button{flex:1;border:2px solid #fff2d0;border-radius:13px;background:linear-gradient(#f9bd73,#e47c45);color:#46261d;font-size:13px;font-weight:1000;padding:7px 4px;min-height:52px;box-shadow:0 3px 0 #9e4d2e}.task-content button:disabled{opacity:.5}.task-content .secondary{background:linear-gradient(#e4f2f3,#a5d6dc)}.task-content .danger{background:linear-gradient(#ffbb9b,#f26d5b)}.task-content .selected{outline:3px solid #fff;filter:brightness(1.12)}.hint{font-size:12px;color:#ffe8cf;align-self:center;line-height:1.5}.notice{position:absolute;top:calc(env(safe-area-inset-top) + 126px);left:12%;right:12%;z-index:8;text-align:center;font-weight:900;background:#4c2b29e8;border:2px solid #ffdcac;border-radius:13px;padding:8px;pointer-events:none;opacity:0;transform:translateY(-8px);transition:.2s}.notice.show{opacity:1;transform:translateY(0)}.modal{position:absolute;z-index:20;inset:0;background:#241819c9;display:flex;align-items:center;justify-content:center;padding:20px}.modal.hidden{display:none}.sheet{width:100%;max-width:400px;text-align:center;background:linear-gradient(160deg,#fff8eb,#f7d6b0);border:5px solid #fff4d7;border-radius:27px;padding:24px 18px;color:#5b3228;box-shadow:0 12px 40px #120b0bb8}.sheet h1{font-size:29px;margin:5px 0 10px}.sheet p{line-height:1.65;font-size:14px}.sheet button{width:100%;background:linear-gradient(#ffbb6d,#e77d42);border:2px solid #fff;border-radius:16px;padding:14px;font-size:18px;font-weight:1000;color:#4b271a;box-shadow:0 5px 0 #ad623c}.sheet .small{font-size:12px;color:#866253}.toast{position:absolute;top:30%;left:12%;right:12%;z-index:10;pointer-events:none;text-align:center;font-weight:1000;font-size:21px;text-shadow:0 3px 5px #3d201d;animation:fadeup .9s forwards}@keyframes fadeup{to{opacity:0;transform:translateY(-30px)}}.lock{position:absolute;z-index:7;top:29%;left:12%;right:12%;text-align:center;background:#6a342be8;border:2px solid #fff1c2;border-radius:16px;padding:14px;font-weight:900;display:none}.lock.show{display:block}.floatlabel{position:absolute;z-index:4;top:31%;left:30%;right:20%;text-align:center;background:#fff1d5;color:#713d32;padding:6px;border-radius:12px;font-weight:900;font-size:12px;transform:rotate(-4deg)}@media(max-height:680px){.brand{top:calc(env(safe-area-inset-top) + 65px)}.bottom{min-height:105px}.task-content{min-height:48px}.task-content button{min-height:44px}}
</style></head><body><main id="game"><div class="top"><div class="stat"><small>⏱️ 剩餘</small><strong id="time">00:45</strong></div><div class="stat"><small>⭐ 分數</small><strong id="score">0</strong></div><div class="stat"><small>💗 壓力 <b id="stressText">0%</b></small><div class="pressure"><i id="stress"></i></div><strong id="combo" style="font-size:12px">COMBO ×0</strong></div></div><div class="brand">個管手速王<span>V0.4 · 多工大作戰</span></div><div id="floatlabel" class="floatlabel">今天也要準時下班！</div><button class="hotspot" id="plan" data-job="plan"><span class="count" hidden>0</span><span class="name">💻 寫計畫</span></button><button class="hotspot" id="phone" data-job="phone"><span class="count" hidden>0</span><span class="name">☎️ 室內電話</span></button><button class="hotspot" id="line" data-job="line"><span class="count" hidden>0</span><span class="name">💬 LINE</span></button><button class="hotspot" id="visit" data-job="visit"><span class="count" hidden>0</span><span class="name">👜 家訪</span></button><button class="hotspot" id="incident" data-job="incident"><span class="count" hidden>0</span><span class="name">🚨 異常事件</span></button><button class="hotspot" id="budget" data-job="budget"><span class="count" hidden>0</span><span class="name">🧮 開額度</span></button><div class="notice" id="notice"></div><div class="lock" id="visitLock">🛵 家訪進行中…<br><span id="visitRemain"></span></div><div class="bottom"><div class="bottom-title"><div id="workTitle">📋 工作處理區</div><span id="workMeta">點擊辦公室物件開始</span></div><div class="task-content" id="workBody"><div class="hint">同時處理多項工作，隨時切換不會失去進度。</div></div></div><div class="modal" id="modal"><div class="sheet"><h1 id="modalTitle">🏆 個管手速王</h1><p id="modalText">45 秒多工挑戰！點擊辦公室的六種物件，工作進度可以保留並自由切換。<br>電話接起來後，還能繼續處理 LINE、計畫和額度。<br><b>異常事件請優先處理！</b></p><button id="mainButton">開始上班！</button><p class="small">手機直式最佳體驗 · 無須登入 · 本機遊玩</p></div></div></main><script>
(function(){'use strict';const $=id=>document.getElementById(id),DURATION=45;let active=false,remaining=45,score=0,combo=0,success=0,missed=0,selected=null,events=[],nextId=1,visitUntil=0,callUntil=0,callBlackhole=false,blackholeUntil=0,spawnClock=0,lastTick=0,raf=0,noticeTimer=0;const names={plan:'照顧計畫',phone:'室內電話',line:'LINE 訊息',visit:'家訪',incident:'異常事件',budget:'額度分配'},points={plan:150,phone:60,line:40,visit:240,incident:300,budget:200},penalties={plan:90,phone:75,line:45,visit:130,incident:180,budget:90},deadlines={plan:15,phone:7,line:11,visit:16,incident:12,budget:17};let tasks={};function reset(){remaining=45;score=0;combo=0;success=0;missed=0;selected=null;events=[];nextId=1;visitUntil=0;callUntil=0;callBlackhole=false;blackholeUntil=0;spawnClock=0;tasks={};for(const k of Object.keys(names))tasks[k]=[];updateUI();renderWork()}function add(type){if(tasks[type].length>= (type==='line'?5:2))return;let now=performance.now(),e={id:nextId++,type,created:now,due:now+deadlines[type]*1000,step:0};tasks[type].push(e);events.push(e);if(type==='incident')showNotice('🚨 異常事件！請優先處理');else if(type==='phone')showNotice('☎️ 室內電話響了！');else if(type==='visit')showNotice('👜 家訪時間快到了！');else if(type==='line'&&tasks.line.length>=3)showNotice('💬 LINE 訊息轟炸！');updateUI();if(!selected)selected=type;renderWork()}function showNotice(s){$('notice').textContent=s;$('notice').classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.remove('show'),1350)}function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;$('game').appendChild(e);setTimeout(()=>e.remove(),950)}function get(type){return tasks[type][0]}function complete(e){if(!e)return;tasks[e.type]=tasks[e.type].filter(x=>x.id!==e.id);events=events.filter(x=>x.id!==e.id);score+=points[e.type]+Math.min(combo,8)*5;combo++;success++;toast('+'+points[e.type]+' ✓');if(e.type==='incident'&&Math.random()<.6)add('line');if(!get(selected))selected=events[0]?.type||null;updateUI();renderWork()}function fail(e){tasks[e.type]=tasks[e.type].filter(x=>x.id!==e.id);events=events.filter(x=>x.id!==e.id);score=Math.max(0,score-penalties[e.type]);combo=0;missed++;if(e.type==='incident'&&Math.random()<.8)add('phone');if(e.type==='budget'&&Math.random()<.7)add('line');if(!get(selected))selected=events[0]?.type||null;toast('逾時 -'+penalties[e.type]);updateUI();renderWork()}function updateUI(){let count=events.length;let pressure=Math.min(100,Math.round(count*13+events.filter(e=>e.due-performance.now()<4000).length*13+(callBlackhole?12:0)));$('time').textContent='00:'+String(Math.ceil(remaining)).padStart(2,'0');$('score').textContent=score.toLocaleString();$('stress').style.width=pressure+'%';$('stressText').textContent=pressure+'%';$('combo').textContent='COMBO ×'+combo;$('floatlabel').textContent=pressure>78?'救命！怎麼又來了！':pressure>45?'先處理哪一個啊？！':'今天也要準時下班！';for(let type of Object.keys(names)){let el=$(type),n=tasks[type].length,b=el.querySelector('.count');b.hidden=!n;b.textContent=n;el.classList.toggle('attention',n>0);el.style.borderColor=selected===type?'#80f6ff':'#ffe5b4d9'}}function btn(label,handler,cls=''){let b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',handler);return b}function renderWork(){let title=$('workTitle'),meta=$('workMeta'),body=$('workBody');body.replaceChildren();if(!selected||!get(selected)){title.textContent='📋 工作處理區';meta.textContent='點擊發亮的物件';body.innerHTML='<div class="hint">可自由切換工作，電話接通後仍能繼續處理其他任務。</div>';return}let e=get(selected),type=e.type;title.textContent='📋 '+names[type];meta.textContent='剩 '+Math.max(0,Math.ceil((e.due-performance.now())/1000))+' 秒';if(type==='plan'){const steps=['確認需求','安排服務','送出計畫'];body.append(btn('💻 '+steps[e.step]+' ('+(e.step+1)+'/3)',()=>{e.step++;if(e.step>=3)complete(e);else renderWork()}));body.append(btn('↩ 切換其他工作',()=>{selected=null;renderWork()},'secondary'))}else if(type==='incident'){const steps=['☎️ 聯繫確認','🤝 協調處理','📝 完成通報'];body.append(btn(steps[e.step]+' ('+(e.step+1)+'/3)',()=>{e.step++;if(e.step>=3)complete(e);else renderWork()},'danger'));body.append(btn('↩ 稍後繼續',()=>{selected=null;renderWork()},'secondary'))}else if(type==='budget'){if(e.step===0){body.append(btn('📂 開啟個案額度',()=>{e.step=1;renderWork()}))}else if(e.step===1){body.append(btn('💰 分配照顧額度',()=>{e.step=2;renderWork()}));body.append(btn('🚗 分配交通額度',()=>{e.step=2;renderWork()},'secondary'))}else{body.append(btn('💾 確認儲存',()=>complete(e)))}body.append(btn('↩ 切換',()=>{selected=null;renderWork()},'secondary'))}else if(type==='line'){body.append(btn('💬 回覆訊息（未讀 '+tasks.line.length+'）',()=>complete(e)));body.append(btn('↩ 稍後再回',()=>{selected=null;renderWork()},'secondary'))}else if(type==='phone'){if(callUntil>performance.now()){body.innerHTML='<div class="hint">☎️ 通話中！可繼續切換工作處理其他事項。</div>';body.append(btn('切換其他工作',()=>{selected=null;renderWork()},'secondary'));if(callBlackhole)body.append(btn('抓準時機結束通話',()=>{if(performance.now()>=blackholeUntil){callBlackhole=false;callUntil=performance.now()+250;toast('電話黑洞脫身！')}else{blackholeUntil+=850;showNotice('☎️「啊！對了！還有一件事…」')}},'danger'))}else{body.append(btn('☎️ 接聽來電',()=>{callBlackhole=Math.random()<.38;callUntil=performance.now()+(callBlackhole?6500:2800);blackholeUntil=performance.now()+2300;showNotice(callBlackhole?'電話黑洞！對方講不停…':'通話中，可以繼續工作');selected=null;renderWork()}))}}else if(type==='visit'){body.append(btn('🛵 出發家訪（大型按鈕）',()=>{visitUntil=performance.now()+3400;showNotice('🛵 家訪中，辦公室訊息仍會累積');selected=null;renderWork()}));body.append(btn('↩ 稍後出發',()=>{selected=null;renderWork()},'secondary'))}}function select(type){if(!active)return;if(visitUntil>performance.now()){showNotice('🛵 家訪中，回辦公室再處理！');return}if(type==='phone'&&callUntil>performance.now()){showNotice('☎️ 已在通話中，可處理其他工作');return}if(!get(type)){showNotice(names[type]+'目前沒有待辦');return}selected=type;updateUI();renderWork()}for(const el of document.querySelectorAll('.hotspot'))el.addEventListener('click',()=>select(el.dataset.job));function spawn(elapsed){let types=elapsed<8?['plan','line','phone','visit']:elapsed<20?['plan','line','phone','visit','budget']:['plan','line','phone','visit','budget','incident'];let weights=types.concat(['line','phone']);let t=weights[Math.floor(Math.random()*weights.length)];add(t);if(elapsed>30&&Math.random()<.27)add('line')}function tick(now){if(!active)return;let delta=Math.min(.1,(now-lastTick)/1000||0);lastTick=now;remaining=Math.max(0,remaining-delta);let elapsed=DURATION-remaining;spawnClock+=delta;let interval=elapsed<8?3.3:elapsed<20?2.45:elapsed<33?1.85:1.4;if(spawnClock>=interval){spawnClock=0;spawn(elapsed)}if(callUntil&&now>=callUntil){callUntil=0;callBlackhole=false;let e=get('phone');if(e)complete(e)}if(visitUntil&&now>=visitUntil){visitUntil=0;let e=get('visit');if(e)complete(e)}$('visitLock').classList.toggle('show',visitUntil>now);if(visitUntil>now)$('visitRemain').textContent=(Math.max(0,(visitUntil-now)/1000)).toFixed(1)+' 秒';for(let e of [...events]){if(e.due<=now&&!(e.type==='phone'&&callUntil>now)&&!(e.type==='visit'&&visitUntil>now))fail(e)}updateUI();if(selected&&get(selected))$('workMeta').textContent='剩 '+Math.max(0,Math.ceil((get(selected).due-now)/1000))+' 秒';if(remaining<=0){end();return}raf=requestAnimationFrame(tick)}function start(){reset();$('modal').classList.add('hidden');active=true;add('plan');add('line');lastTick=performance.now();raf=requestAnimationFrame(tick)}function end(){active=false;cancelAnimationFrame(raf);$('visitLock').classList.remove('show');$('modal').classList.remove('hidden');$('modalTitle').textContent=score>=1800?'🏆 多工傳說！':score>=1000?'✨ 資深個管！':'😵 今天也辛苦了';$('modalText').innerHTML='<b style="font-size:30px">'+score.toLocaleString()+' 分</b><br>完成 '+success+' 件｜逾時 '+missed+' 件<br><br>真正的挑戰是邊接電話、邊回 LINE，還要記得處理異常事件！';$('mainButton').textContent='再挑戰 45 秒'}$('mainButton').addEventListener('click',start);document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){lastTick=performance.now()}});reset();})();
</script></body></html>
