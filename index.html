<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7d3a9"><title>個管手速王 V0.6｜多工大作戰</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#3e2b27;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;touch-action:manipulation}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.shell{height:100dvh;display:flex;justify-content:center;align-items:center;background:radial-gradient(#d9aa84,#402923)}.stage{height:min(100dvh,150vw);width:min(100vw,66.6667dvh);max-height:100dvh;position:relative;overflow:hidden;isolation:isolate;box-shadow:0 0 30px #25130caa}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.hot{position:absolute;border:0;background:transparent;z-index:3;border-radius:18%;padding:0;touch-action:manipulation}.hot:focus-visible{outline:3px solid #fff}.hot.active:before{content:"";position:absolute;inset:2%;border-radius:20%;box-shadow:0 0 0 3px #fff7,0 0 18px 7px var(--glow),inset 0 0 18px var(--glow);animation:pulse .85s infinite alternate;pointer-events:none}.hot.active:after{content:attr(data-n);position:absolute;right:-2%;top:-10%;background:#e84936;color:white;font-weight:1000;font-size:clamp(11px,3.1vw,19px);border:2px solid white;border-radius:50%;min-width:24px;aspect-ratio:1;display:grid;place-items:center;box-shadow:0 2px 7px #0005}.hot.sel{outline:3px solid #fff9;outline-offset:-3px}@keyframes pulse{to{filter:brightness(1.6);transform:scale(1.035)}}.clock,.score,.pressure{position:absolute;z-index:5;color:#fff;font-weight:1000;text-align:center;text-shadow:0 2px 4px #3e2318;pointer-events:none}.clock{left:37%;top:5.7%;width:16%;font-size:clamp(20px,5.5vw,37px)}.score{left:62%;top:5.8%;width:10%;font-size:clamp(19px,5vw,34px)}.pressure{left:77%;top:7.8%;width:18%;height:1.8%;border-radius:50px;overflow:hidden}.pressure>div{height:100%;width:0;background:linear-gradient(90deg,#55c75b,#ffe04a,#e64c36);transition:width .25s}.panel{position:absolute;z-index:8;left:5%;right:5%;bottom:7%;border-radius:22px;background:linear-gradient(155deg,#fffaf0f5,#ffe3c9f8);border:3px solid #fff;box-shadow:0 8px 22px #3c1e13a8;padding:12px 13px 14px;color:#593523;display:none}.panel.show{display:block}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.panelhead strong{font-size:clamp(14px,3.9vw,21px)}.close{border:0;background:#ead1ba;color:#704531;border-radius:50%;width:30px;height:30px;font-size:18px;font-weight:900}.hint{font-size:clamp(11px,3vw,14px);line-height:1.4;min-height:18px;margin-bottom:9px}.actions{display:flex;gap:8px}.act{flex:1;min-height:58px;border:2px solid #fff;border-radius:14px;color:white;font-weight:900;font-size:clamp(15px,4.2vw,22px);background:linear-gradient(#f49d56,#cf6636);box-shadow:0 4px 0 #ad512c;touch-action:manipulation}.act:active{transform:translateY(2px);box-shadow:0 2px 0 #ad512c}.act.secondary{background:linear-gradient(#82c9ac,#398c76);box-shadow:0 4px 0 #216b56}.toast{position:absolute;z-index:12;top:17%;left:14%;right:14%;text-align:center;color:#fff;font-weight:900;background:#4d3029e8;border:2px solid #fff8;border-radius:16px;padding:10px;opacity:0;transform:translateY(-9px);transition:.2s;pointer-events:none}.toast.on{opacity:1;transform:none}.veil{position:absolute;inset:0;z-index:20;background:#2b1a16c9;display:grid;place-items:center;padding:6%}.modal{width:100%;max-width:410px;background:#fff6e8;border:4px solid white;border-radius:26px;text-align:center;padding:25px 20px;color:#623a29;box-shadow:0 18px 40px #170b08a0}.modal h1{font-size:clamp(24px,7vw,36px);margin:0 0 12px}.modal p{line-height:1.65;font-size:15px}.modal button{width:100%;border:0;border-radius:16px;padding:16px 10px;background:#df8245;color:white;font-size:20px;font-weight:1000;box-shadow:0 5px 0 #aa542b}.mini{font-size:12px;opacity:.75}.bottomstatus{position:absolute;z-index:5;left:7%;bottom:3.3%;right:7%;display:flex;justify-content:space-between;color:#fff;font-size:clamp(10px,2.7vw,14px);font-weight:900;text-shadow:0 2px 5px #361b14;pointer-events:none}.visit{position:absolute;inset:0;z-index:15;background:#f8d8acde;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#5c3b2c;font-weight:900;font-size:26px}.visit.show{display:flex}.visit small{font-size:15px;margin-top:15px}.visit .bubble{font-size:70px;animation:walk .5s infinite alternate}@keyframes walk{to{transform:translateX(13px) rotate(8deg)}}
</style></head><body><div class="shell"><main class="stage" id="stage"><img class="bg" src="office.jpg" alt="個管辦公室場景"><div class="clock" id="clock">00:45</div><div class="score" id="score">0</div><div class="pressure"><div id="pressure"></div></div>
<button class="hot" data-k="plan" aria-label="照顧計畫" style="left:4%;top:41%;width:24%;height:13%;--glow:#69b6ff"></button>
<button class="hot" data-k="phone" aria-label="室內電話" style="left:72%;top:36%;width:26%;height:13%;--glow:#ffcf44"></button>
<button class="hot" data-k="line" aria-label="LINE" style="left:67%;top:49%;width:18%;height:13%;--glow:#67ff8e"></button>
<button class="hot" data-k="visit" aria-label="家訪" style="left:80%;top:50%;width:19%;height:24%;--glow:#ffd361"></button>
<button class="hot" data-k="incident" aria-label="異常事件" style="left:40%;top:58%;width:27%;height:17%;--glow:#ff5a4c"></button>
<button class="hot" data-k="budget" aria-label="開額度" style="left:15%;top:64%;width:25%;height:13%;--glow:#f6d94d"></button>
<div class="toast" id="toast"></div><section class="panel" id="panel"><div class="panelhead"><strong id="paneltitle"></strong><button class="close" id="close" aria-label="關閉">×</button></div><div class="hint" id="hint"></div><div class="actions" id="actions"></div></section><div class="bottomstatus"><span id="done">完成 0 件</span><span id="pending">待辦 0 件</span><span id="miss">逾時 0 件</span></div><div class="visit" id="visitScreen"><div class="bubble">🛵</div>家訪進行中<small>其他工作持續累積……</small></div><div class="veil" id="veil"><div class="modal" id="modal"><h1>個管手速王</h1><p>45 秒多工大作戰！<br>哪個辦公物件亮起來，就點它處理。<br>工作可以中途切換，進度會保留。<br>接電話時也能處理其他工作！</p><button id="start">開始上班！</button><p class="mini">手機直式｜點擊發光物件｜限時 45 秒</p></div></div></main></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),keys=['plan','phone','line','visit','incident','budget'];const names={plan:'照顧計畫',phone:'室內電話',line:'LINE 訊息',visit:'家訪',incident:'異常事件',budget:'開額度'};const colors={plan:150,phone:60,line:40,visit:240,incident:300,budget:200};let jobs,selected=null,started=false,elapsed=0,score=0,done=0,miss=0,callUntil=0,visitUntil=0,clockId,spawnId,last=0,toastId;const $hot=Object.fromEntries([...document.querySelectorAll('.hot')].map(x=>[x.dataset.k,x]));function notify(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toastId);toastId=setTimeout(()=>$('toast').classList.remove('on'),1050)}function add(k,quiet=false){if(!started)return;let q=jobs[k];if(q.length>= (k==='line'?5:3))return;let limit={plan:16,phone:7,line:10,visit:17,incident:16,budget:17}[k];q.push({id:++last,step:0,deadline:elapsed+limit,blackhole:k==='phone'&&Math.random()<.28});update();if(!quiet)notify(names[k]+'來了！')}function update(){let pending=0;for(let k of keys){let n=jobs[k].length;pending+=n;$hot[k].classList.toggle('active',n>0);$hot[k].classList.toggle('sel',selected===k);$hot[k].dataset.n=n||''}let stress=Math.min(100,pending*14+miss*5);$('pressure').style.width=stress+'%';$('score').textContent=score;$('done').textContent='完成 '+done+' 件';$('pending').textContent='待辦 '+pending+' 件';$('miss').textContent='逾時 '+miss+' 件';$('clock').textContent='00:'+String(Math.max(0,45-Math.floor(elapsed))).padStart(2,'0');render()}
function finish(k){jobs[k].shift();score+=colors[k];done++;notify(names[k]+'完成 +'+colors[k]);if(k==='phone')callUntil=0;selected=jobs[k].length?k:null;update()}
function step(k){if(!started||elapsed<visitUntil||!jobs[k].length)return;let j=jobs[k][0];if(k==='phone'){if(!j.step){j.step=1;callUntil=elapsed+(j.blackhole?5:2);notify(j.blackhole?'電話黑洞！對方還在講…':'已接聽，可同時處理其他工作');update();return}if(elapsed<callUntil){notify('通話中，仍可處理其他工作');return}finish(k);return}if(k==='visit'){if(!j.step){j.step=1;visitUntil=elapsed+3;$('visitScreen').classList.add('show');selected=null;update();return}return}if(k==='line'){finish(k);return}j.step++;let max=k==='budget'?2:3;if(j.step>=max){finish(k)}else update()}
function render(){const p=$('panel'),a=$('actions');if(!started||elapsed<visitUntil||!selected||!jobs[selected].length){p.classList.remove('show');return}let k=selected,j=jobs[k][0];p.classList.add('show');$('paneltitle').textContent=names[k]+' · '+jobs[k].length+' 件待辦';a.innerHTML='';let hint='',label='';if(k==='plan'){let steps=['確認評估需求','安排照顧服務','送出照顧計畫'];label=steps[j.step];hint='進度 '+j.step+'/3｜點擊下一步完成計畫'}else if(k==='budget'){label=['確認本月額度','開立完成 · 儲存'][j.step];hint='進度 '+j.step+'/2｜確認後完成開額度'}else if(k==='incident'){label=['聯繫確認安全','協調後續處理','完成通報紀錄'][j.step];hint='進度 '+j.step+'/3｜異常事件優先處理'}else if(k==='line'){label='快速回覆訊息 ✓';hint='未讀 '+jobs[k].length+' 則｜逐則回覆'}else if(k==='phone'){label=j.step?(elapsed<callUntil?'通話中…':'結束通話 ✓'):'接聽電話';hint=j.step?'通話期間可關閉面板，繼續處理其他工作':'接起電話後，其他工作仍可操作'}else{label='出發家訪';hint='出發後外出 3 秒，期間其他工作會累積'}$('hint').textContent=hint;const b=document.createElement('button');b.className='act';b.textContent=label;b.disabled=k==='phone'&&j.step&&elapsed<callUntil;b.style.opacity=b.disabled?'.55':'1';b.onclick=()=>step(k);a.appendChild(b);if(k==='phone'&&j.step){const other=document.createElement('button');other.className='act secondary';other.textContent='先處理其他工作';other.onclick=()=>{selected=null;update()};a.appendChild(other)}}
function pick(k){if(!started||elapsed<visitUntil)return;if(!jobs[k].length){notify(names[k]+'目前沒有待辦');return}selected=k;update()}
for(let k of keys)$hot[k].addEventListener('click',()=>pick(k));$('close').onclick=()=>{selected=null;update()};function tick(){if(!started)return;elapsed=Math.min(45,(performance.now()-window.startAt)/1000);for(let k of keys){while(jobs[k].length&&jobs[k][0].deadline<=elapsed){jobs[k].shift();miss++;score=Math.max(0,score-({incident:170,visit:150,plan:100,budget:90,phone:70,line:35}[k]));if(selected===k)selected=null;notify(names[k]+'逾時！')}}if(visitUntil&&elapsed>=visitUntil){visitUntil=0;$('visitScreen').classList.remove('show');if(jobs.visit.length&&jobs.visit[0].step===1)finish('visit')}if(elapsed>=45){end();return}update()}
function spawn(){if(!started)return;const r=Math.random(),phase=elapsed<9?0:elapsed<22?1:elapsed<34?2:3;const pool=phase===0?['plan','line','phone','budget']:phase===1?['plan','line','line','phone','visit','budget','incident']:['plan','line','line','phone','phone','visit','budget','incident','incident'];add(pool[Math.floor(r*pool.length)],true);if(phase>=2&&Math.random()<.22)add('line',true);let next=phase===0?2400:phase===1?1800:phase===2?1250:950;spawnId=setTimeout(spawn,next)}
function start(){clearInterval(clockId);clearTimeout(spawnId);jobs=Object.fromEntries(keys.map(k=>[k,[]]));selected=null;started=true;elapsed=0;score=0;done=0;miss=0;last=0;visitUntil=0;callUntil=0;$('veil').style.display='none';$('visitScreen').classList.remove('show');window.startAt=performance.now();add('plan',true);add('line',true);update();clockId=setInterval(tick,120);spawnId=setTimeout(spawn,2300)}function end(){started=false;clearInterval(clockId);clearTimeout(spawnId);$('visitScreen').classList.remove('show');$('panel').classList.remove('show');let title=score>=1800?'多工傳說':score>=1100?'個管手速王':score>=600?'忙碌個管':'新人個管';$('modal').innerHTML='<h1>下班啦！</h1><h2>'+title+'</h2><p>總分 <b>'+score+'</b> 分<br>完成 '+done+' 件｜逾時 '+miss+' 件</p><p class="mini">45 秒挑戰 · 每次事件隨機出現</p><button id="again">再挑戰一次</button>';$('veil').style.display='grid';$('again').onclick=start} $('start').onclick=start;})();
</script></body></html>
